<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Controle · Equipe e Frota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f4f5fa;--card:#fff;--ink:#1d2033;--ink2:#4a4f66;--muted:#8b90a6;--line:#eceef5;--soft:#f6f7fb;
  --accent:#4f5fd8;--accent2:#3d4cc4;--accent-soft:#eef0fd;
  --green:#22c55e;--yellow:#f5a623;--red:#ef4444;--blue:#4f63d6;--gray:#94a3b8;--pink:#d94ee8;
  --shadow:0 1px 2px rgba(20,24,60,.04),0 6px 18px rgba(20,24,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)} .s{font-size:11.5px} .fw5{font-weight:500}
.mono{font-family:ui-monospace,'SF Mono',Consolas,monospace;letter-spacing:.3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.rail{width:76px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:8px;position:sticky;top:0;height:100vh;z-index:20;flex:none}
.logo{font-weight:700;font-size:25px;color:var(--accent);letter-spacing:-1px;margin-bottom:28px;line-height:1}
.nav-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:#a3a8bd;display:grid;place-items:center;position:relative;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--soft);color:var(--ink2)}
.nav-btn.on{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(79,95,216,.35)}
.nav-btn .badge{position:absolute;top:3px;right:3px;background:var(--accent);color:#fff;font-size:9px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;display:grid;place-items:center;border:2px solid #fff;font-weight:600}
.nav-btn.on .badge{background:#fff;color:var(--accent);border-color:var(--accent)}
.nav-btn .tip{position:absolute;left:56px;background:var(--ink);color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-4px);transition:.15s}
.nav-btn:hover .tip{opacity:1;transform:none}
.rail .spacer{flex:1}
.nav-btn.out{color:var(--red)} .nav-btn.out:hover{background:#fdeeee}
.main{flex:1;min-width:0;padding:22px 30px 48px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:18px;font-weight:600;margin:0}
.topbar .sub{color:var(--muted);font-size:12px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.userchip{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);padding:4px 14px 4px 4px;border-radius:30px}
.userchip b{font-weight:600;font-size:12px;display:block;line-height:1.25}
.userchip small{color:var(--muted);font-size:10.5px}
.live{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.demo-tag{background:#fff6e5;color:#a8701a;border:1px solid #fde3b0;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:500}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid #eff0f6}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:600}
.card-b{padding:18px 22px 22px}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);flex:none}
.kpi b{font-size:22px;font-weight:600;display:block;line-height:1.15}
.kpi span{color:var(--ink2);font-size:12px}
.kpi .k-sub{color:var(--muted);font-size:10.5px}

/* ---------- Hero / tabs (referência) ---------- */
.hero{display:flex;align-items:center;gap:18px;padding:4px 4px 20px}
.hero h2{margin:0;font-size:18px;font-weight:600}
.hero p{margin:4px 0 0;color:var(--muted);text-transform:none}
.tabs{display:flex;gap:6px;background:#fff;border-radius:12px;padding:0 12px;box-shadow:var(--shadow);border:1px solid #eff0f6;margin-bottom:18px;overflow-x:auto}
.tab,.mtab{border:0;background:none;padding:15px 16px 13px;color:var(--ink2);font-size:12.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on,.mtab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.mtab{padding:10px 12px}

/* ---------- Donut overview ---------- */
.overview{display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:center}
.donut-wrap{position:relative;width:260px;height:260px;margin:auto}
.donut-wrap svg{display:block}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-c small{color:var(--muted);font-size:12px}
.donut-c b{font-size:20px;font-weight:600;margin:4px 0 10px}
.donut-c hr{width:120px;border:0;border-top:1px solid var(--line);margin:0 0 10px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px 34px}
.lg{display:flex;align-items:center;gap:12px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.lg .n{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:11.5px;font-weight:500;flex:none}
.lg .p{width:36px;color:var(--muted);font-size:11.5px}
.lg .l{flex:1;font-weight:500;font-size:12px}
.lg .pill{background:var(--c);color:#fff;padding:5px 10px;border-radius:5px;font-size:11px;min-width:110px;text-align:center}
.lg:hover .l{color:var(--accent)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#f3f4f9;text-align:left;font-weight:500;font-size:11.5px;color:var(--ink2);padding:11px 12px;white-space:nowrap}
th:first-child{border-radius:8px 0 0 8px} th:last-child{border-radius:0 8px 8px 0}
th.sort{cursor:pointer;user-select:none} th .ar{opacity:.45;margin-left:5px;font-size:9px}
td{padding:13px 12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#fafbff}
td.act{text-align:right;white-space:nowrap}
.tfoot{color:var(--muted);font-size:11.5px;padding-top:12px}

/* ---------- Chips / tags ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;color:color-mix(in srgb,var(--c) 80%,#000);background:color-mix(in srgb,var(--c) 13%,#fff);white-space:nowrap;border:0;line-height:1.5}
.chip .d,.dot{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
button.chip:hover{background:color-mix(in srgb,var(--c) 22%,#fff)}
.chip .caret{font-size:8px;opacity:.7}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;color:color-mix(in srgb,var(--c) 85%,#000);background:color-mix(in srgb,var(--c) 11%,#fff)}

/* ---------- Buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:500;font-size:12.5px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:#d9dcea;background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,95,216,.28)}
.btn.pri:hover{background:var(--accent2)}
.btn.danger{color:var(--red)} .btn.danger:hover{background:#fdeeee;border-color:#f8cfcf}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.full{width:100%;justify-content:center;padding:12px}
.btn:disabled{opacity:.6;cursor:wait}
.icon-btn{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--ink2);display:inline-grid;place-items:center;vertical-align:middle}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn.xs{width:24px;height:24px}
.icon-btn.bord{border:1px solid var(--line);background:#fff}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:500;padding:8px 0;font-size:12px}
.lnk{color:var(--accent);cursor:pointer;font-weight:500}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tb-right{margin-left:auto;display:flex;gap:8px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px;flex:1;min-width:200px;max-width:380px;color:var(--muted)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;outline:0;padding:10px 0;flex:1;background:transparent;min-width:0}
.sel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;outline:0}
.sel.sm{padding:6px 10px;font-size:12px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--ink2);font-size:12px;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.seg.full{display:flex;margin-bottom:18px} .seg.full button{flex:1;justify-content:center;padding:9px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fchip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);transition:.15s}
.fchip .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.fchip b{font-weight:600;color:var(--ink)}
.fchip:hover{border-color:color-mix(in srgb,var(--c) 45%,#fff)}
.fchip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--ink)}
.hint{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;margin:-4px 0 16px}

/* ---------- Avatar ---------- */
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;background:var(--c)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:11px;display:block}
.pos{font-size:12px}

/* ---------- Placa Mercosul ---------- */
.plate{display:inline-flex;flex-direction:column;align-items:stretch;border:2px solid #23263a;border-radius:6px;overflow:hidden;background:#fff;min-width:124px;vertical-align:middle}
.plate i{display:block;background:#1e40af;color:#fff;font-style:normal;font-size:7.5px;letter-spacing:2.5px;text-align:center;padding:1.5px 0;font-weight:600}
.plate b{font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:19px;letter-spacing:2.5px;padding:3px 10px;font-weight:700;text-align:center;color:#1d2033}
.plate.mini{min-width:0;border-width:1.5px;border-radius:4px}
.plate.mini i{font-size:4.5px;letter-spacing:1px;padding:0;height:4px;line-height:4px}
.plate.mini b{font-size:11px;padding:1px 6px;letter-spacing:1px}
.vlink{display:inline-flex;align-items:center;gap:8px}

/* ---------- Frota ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.vcard{padding:16px 16px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s;border-top:3px solid var(--c)}
.vcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,24,60,.09)}
.vtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.vico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--ink2)}
.vmid{text-align:center;margin-bottom:12px}
.vmodel{font-weight:600;margin-top:10px}
.vmeta{color:var(--muted);font-size:11.5px;margin-top:2px}
.vobs{display:flex;gap:7px;align-items:flex-start;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--ink2);border-radius:8px;padding:8px 10px;font-size:11.5px;margin-bottom:10px}
.vobs svg{flex:none;margin-top:1px;color:var(--c)}
.vfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:11.5px;gap:8px}
.vupd{color:var(--muted);font-size:10.5px;margin-top:8px}

/* ---------- Popover status ---------- */
.pop{position:fixed;z-index:60;background:#fff;border-radius:12px;box-shadow:0 14px 44px rgba(20,24,60,.2);border:1px solid var(--line);padding:10px;width:262px;animation:pop .12s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.pop h5{margin:2px 6px 8px;font-size:12px;color:var(--ink);font-weight:600}
.pop textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:none;height:50px;outline:0;font-size:12px;margin-bottom:6px}
.pop textarea:focus{border-color:var(--accent)}
.pop-opt{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:8px;border-radius:8px;text-align:left}
.pop-opt:hover{background:var(--soft)}
.pop-opt .d{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,#fff);flex:none}
.pop-opt div{flex:1}
.pop-opt b{font-weight:500;display:block;font-size:12.5px}
.pop-opt small{color:var(--muted);font-size:10.5px}
.pop-opt.cur{background:var(--accent-soft)} .pop-opt.cur svg{color:var(--accent)}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;background:rgba(20,24,50,.4);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:580px;box-shadow:0 24px 70px rgba(0,0,0,.22);animation:up .18s ease}
.modal.wide{max-width:780px}
.m-h{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
.m-h h3{margin:0;font-size:15px;font-weight:600}
.m-b{padding:20px 22px}
.m-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);background:#fcfcfe;border-radius:0 0 16px 16px;flex-wrap:wrap}
.m-f .left{margin-right:auto}
.cf-ico{width:52px;height:52px;border-radius:50%;background:#fdeeee;color:var(--red);display:grid;place-items:center;margin:auto}

/* ---------- Forms ---------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:11.5px;font-weight:500;color:var(--ink2)}
.f label em{color:var(--red);font-style:normal}
.f input,.f select,.f textarea,.ta{border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;background:#fff;transition:border-color .15s,box-shadow .15s;width:100%}
.f input:focus,.f select:focus,.f textarea:focus,.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f textarea,.ta{resize:vertical;min-height:84px;line-height:1.5}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.rchip input{position:absolute;opacity:0;pointer-events:none}
.rchip span{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:7px 13px;border-radius:20px;cursor:pointer;font-size:12px;color:var(--ink2);transition:.12s}
.rchip span .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.rchip input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--ink);font-weight:500}
.rchip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.f-hint{font-size:10.5px;color:var(--muted)}

/* ---------- Detalhes ---------- */
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px}
.dl > div small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.dl > div b{font-weight:500}
.dl .full{grid-column:1/-1}
.sec{font-size:12px;font-weight:600;margin:20px 0 8px;color:var(--ink)}
.box{background:var(--soft);border-radius:10px;padding:14px;white-space:pre-wrap;line-height:1.6}
.box.resp{background:#f0fdf4;border:1px solid #d1f5dd}
.resp-by{margin-top:8px;color:var(--muted);font-size:11px}
.minicard{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.minicard:hover{background:#fafbff}
.contact{display:flex;gap:6px;margin-top:4px}
.contact a{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);text-decoration:none;background:var(--accent-soft);padding:3px 9px;border-radius:12px}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 14px}
.tl::before{content:'';position:absolute;left:-18px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff}
.tl b{font-weight:500} .tl small{display:block;color:var(--muted);font-size:11px}
.tl p{margin:4px 0 0;color:var(--ink2);font-size:12px}
.steps{display:flex;gap:0;margin-top:22px}
.step{flex:1;position:relative;padding-top:20px;text-align:center}
.step i{position:absolute;top:0;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#e4e6ef;border:3px solid #fff;box-shadow:0 0 0 1px #e4e6ef;z-index:1}
.step::before{content:'';position:absolute;top:6px;left:0;right:0;height:2px;background:#e4e6ef}
.step:first-child::before{left:50%} .step:last-child::before{right:50%}
.step.done i{background:var(--green);box-shadow:0 0 0 1px var(--green)}
.step b{display:block;font-weight:500;font-size:12px}
.step small{color:var(--muted);font-size:10.5px}
.ch-head h2{margin:0 0 10px;font-size:17px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- Diário ---------- */
.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.ld{padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;border:1px solid #eff0f6;text-align:left;background:#fff}
.ld.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ld b{font-weight:500;display:block}
.ld .nums{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:3px}
.ld .nums span{display:flex;align-items:center;gap:4px}
.tk{display:flex;gap:14px;align-items:center;padding:14px 18px 14px 20px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.tk:last-child{border-bottom:0}
.tk:hover{background:#fafbff}
.tk::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.tk .num{color:var(--muted);font-size:11.5px;width:40px;flex:none}
.tk .body{flex:1;min-width:0}
.tk .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .m{color:var(--muted);font-size:11px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.replied{color:var(--green);display:grid;place-items:center}

/* ---------- Calendário ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cal-h h2{margin:0 6px;font-size:17px;font-weight:600;min-width:170px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wd{padding:11px 6px;font-size:11px;color:var(--muted);font-weight:500;text-align:center;border-bottom:1px solid var(--line);background:#fafbfe}
.cal .day{min-height:108px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .1s}

.cal .day.we{background:#fcfcfe}
.cal .day.out{color:#c3c6d4} .cal .day.out .ev{opacity:.55}
.cal .day .dn{font-size:11.5px;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;flex:none}
.cal .day.today .dn{background:var(--accent);color:#fff}
.ev{font-size:10.5px;padding:3px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--ink);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.more{font-size:10.5px;color:var(--accent);padding-left:4px;font-weight:500}
.agenda-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.agenda-item:last-child{border-bottom:0}
.agenda-item .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.agenda-item b{font-weight:500;display:block}
.agenda-item small{color:var(--muted);font-size:11px}
.leg-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px}
.leg-row span{display:flex;align-items:center;gap:8px}

/* ---------- Switch ---------- */
.sw{position:relative;display:inline-block;width:38px;height:22px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#dfe2ec;border-radius:22px;cursor:pointer;transition:.2s}
.sw span::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span::after{transform:translateX(16px)}
.info-row{display:flex;gap:14px;align-items:flex-start;color:var(--accent)}
.info-row b{color:var(--ink);font-weight:600}
.info-row p{margin:4px 0 0;color:var(--ink2);line-height:1.6;max-width:820px}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#e6e9fd,transparent 45%),radial-gradient(circle at 90% 90%,#fbeefa,transparent 40%),var(--bg)}
.lcard{width:100%;max-width:410px;padding:32px}
.lcard.center{text-align:center}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.brand .logo{margin:0;width:48px;height:48px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:21px}
.brand b{font-size:16px;font-weight:600;display:block}
.brand small{color:var(--muted);font-size:11.5px}
.lform{display:flex;flex-direction:column;gap:14px}
.lmsg{font-size:12px;color:var(--red);min-height:0}
.lmsg.ok{color:#15803d}
.notice{display:flex;gap:10px;background:#fff8ea;border:1px solid #fde3b0;border-radius:10px;padding:12px;font-size:11.5px;line-height:1.55;color:#7a5410;margin-bottom:18px}
.notice svg{flex:none;margin-top:1px}
.notice code{background:#fff;padding:1px 5px;border-radius:4px;font-size:10.5px}
.demo-list{display:flex;flex-direction:column;gap:8px}
.demo-btn{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;transition:.15s}
.demo-btn:hover{border-color:var(--accent);background:#fafbff}
.demo-btn div{flex:1} .demo-btn b{font-weight:500;display:block} .demo-btn small{color:var(--muted);font-size:11px}
.lbl{font-size:12px;font-weight:500;color:var(--ink2);margin:0 0 10px}
.pend-ico{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px}
.lcard h2{font-size:17px;font-weight:600;margin:0 0 8px}
.row-c{display:flex;gap:10px;justify-content:center;margin-top:20px}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Toast / vazio ---------- */
.toasts{position:fixed;bottom:20px;right:20px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;align-items:center;gap:9px;animation:up .2s;transition:.25s;max-width:380px}
.toast.err{background:#c2312f}
.toast.ok .i{color:#4ade80}
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty .i{width:56px;height:56px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 12px;color:#b4b8cc}
.empty b{display:block;color:var(--ink2);font-weight:500;margin-bottom:4px}

/* ---------- Responsivo ---------- */
@media (max-width:1150px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.overview{grid-template-columns:1fr}.cal-wrap{grid-template-columns:1fr}.two{grid-template-columns:1fr!important}}

  .form,.dl{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px;gap:10px} .kpi .ico{width:38px;height:38px} .kpi b{font-size:18px}
  .cal .day{min-height:62px;padding:4px}

  .hide-m{display:none}
  .tb-right{margin-left:0}

  .toasts{left:14px;right:14px;bottom:80px;align-items:stretch}

function ago(s){
  if(!s) return '';

  const h = m / 60; if (h < 24) return `há ${Math.floor(h)} h`;

}

function downloadCSV(name, rows){
  const s = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const b = new Blob(['\ufeff' + s], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove();

}

const DB = {
  async list(t){
    if (DEMO) return JSON.parse(JSON.stringify(Store.load()[t] || []));
    let q = sb.from(t).select('*');
    if (t === 'veiculo_historico') q = q.order('created_at', {ascending:false}).limit(2000);
    const {data, error} = await q; if (error) throw error; return data;
  },
  async insert(t, row){
    if (DEMO){
      const d = Store.load(); const r = {...row};
      r.id = t === 'chamados' ? Math.max(0, ...d[t].map(x => +x.id)) + 1 : uid();
      r.created_at = nowISO(); d[t].push(r); Store.save(); return r;
    }
    const {data, error} = await sb.from(t).insert(row).select().single(); if (error) throw error; return data;
  },
  async update(t, id, patch){
    if (DEMO){
      const d = Store.load(); const r = d[t].find(x => sameId(x.id, id)); if (r) Object.assign(r, patch); Store.save(); return r;
    }
    const {error} = await sb.from(t).update(patch).eq('id', id); if (error) throw error;
  },
  async remove(t, id){
    if (DEMO){
      const d = Store.load(); d[t] = d[t].filter(x => !sameId(x.id, id));
      if (t === 'veiculos'){
        d.colaboradores.forEach(c => { if (sameId(c.veiculo_id, id)) c.veiculo_id = null; });
        d.chamados.forEach(c => { if (sameId(c.veiculo_id, id)) c.veiculo_id = null; });
        d.veiculo_historico = d.veiculo_historico.filter(x => !sameId(x.veiculo_id, id));
      }
      if (t === 'colaboradores'){
        d.eventos = d.eventos.filter(e => !sameId(e.colaborador_id, id));
        d.chamados.forEach(c => { if (sameId(c.colaborador_id, id)) c.colaborador_id = null; });
      }
      Store.save(); return;
    }
    const {error} = await sb.from(t).delete().eq('id', id); if (error) throw error;
  }
};

function openModal({title, body, foot='', wide=false, onMount}){
  closeModal();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="m-h"><h3>${title}</h3><button class="icon-btn" data-act="modal-close" aria-label="Fechar">${ic('x',18)}</button></div><div class="m-b">${body}</div>${foot?`<div class="m-f">${foot}</div>`:''}</div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  const form = $('form', ov);
  if (form) form.addEventListener('submit', e => { e.preventDefault(); $('.m-f .btn.pri', ov)?.click(); });
  $$('[data-mask=phone]', ov).forEach(i => i.addEventListener('input', () => i.value = fmtPhone(i.value)));
  $$('[data-mask=upper]', ov).forEach(i => i.addEventListener('input', () => i.value = i.value.toUpperCase()));
  onMount && onMount(ov);
  const first = $('form input:not([type=radio]):not([type=checkbox]), form select, form textarea', ov); if (first) first.focus();
}
function closeModal(){ const had = $('#ov'); had?.remove(); document.body.style.overflow = '';

function closePop(){ $('#pop')?.remove(); }
function confirmBox(msg, ok='Excluir'){
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'ov'; el.style.zIndex = 70;
    el.innerHTML = `<div class="modal" style="max-width:390px"><div class="m-b" style="text-align:center;padding:28px 24px 8px"><div class="cf-ico">${ic('alert',24)}</div><p style="margin:14px 0 0;font-size:13.5px;line-height:1.6">${msg}</p></div><div class="m-f" style="justify-content:center;border:0;background:none"><button class="btn" data-x="0">Cancelar</button><button class="btn pri" style="background:var(--red);border-color:var(--red);box-shadow:none" data-x="1">${ok}</button></div></div>`;

}

/* ========================= VISÃO GERAL ========================= */
function startOfWeek(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return x; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDur(h){ if (h == null) return '—'; if (h < 1) return Math.max(1, Math.round(h*60)) + ' min'; if (h < 48) return (h < 10 ? h.toFixed(1).replace('.', ',') : Math.round(h)) + ' h'; return Math.round(h/24) + ' dias'; }
function ausentesEm(ds){ return new Set(S.eventos.filter(e => e.data_inicio <= ds && e.data_fim >= ds).map(e => String(e.colaborador_id))); }

function ringSVG(pct, color, size=60, sw=7){
  const r = (size - sw)/2, c = 2*Math.PI*r, p = Math.max(0, Math.min(1, pct || 0)), m = size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="ring" aria-hidden="true"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="#eef0f6" stroke-width="${sw}"/>${p>0?`<circle class="ring-v" cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${m} ${m})"/>`:''}<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${Math.round(size*.23)}" font-weight="600" fill="#1d2033">${Math.round(p*100)}%</text></svg>`;
}
function sparkSVG(vals, color, w=128, h=44){
  const max = Math.max(1, ...vals), n = vals.length, step = (w-8)/(n-1);
  const pts = vals.map((v,i) => [4 + i*step, h - 5 - (v/max)*(h-12)]);
  const line = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[n-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="spark" aria-hidden="true"><path d="${line} L${last[0].toFixed(1)} ${h} L4 ${h} Z" fill="${color}" opacity=".13"/><path class="spark-l" d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/></svg>`;
}
function gaugeSVG(pct, color){
  const R = 90, L = Math.PI*R, p = Math.max(0, Math.min(1, pct || 0));
  const d = 'M 20 112 A 90 90 0 0 1 200 112';
  const ticks = [0,.25,.5,.75,1].map(t => { const a = Math.PI*(1-t), x1 = 110+Math.cos(a)*104, y1 = 112-Math.sin(a)*104, x2 = 110+Math.cos(a)*110, y2 = 112-Math.sin(a)*110; return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#d6d9e6" stroke-width="2" stroke-linecap="round"/>`; }).join('');
  return `<svg viewBox="0 0 220 122" class="gauge" aria-hidden="true">${ticks}<path d="${d}" fill="none" stroke="#eef0f6" stroke-width="18" stroke-linecap="round"/>${p>0?`<path class="gauge-v" d="${d}" fill="none" stroke="${color}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${(L*p).toFixed(1)} ${L.toFixed(1)}"/>`:''}</svg>`;
}
function weeksChart(chs){
  const W = 8, s0 = startOfWeek(new Date()), weeks = [];
  for (let i = W-1; i >= 0; i--){ const a = addDays(s0, -7*i); weeks.push({a, b:addDays(a,7), ab:0, re:0}); }
  const find = t => weeks.find(w => t >= w.a && t < w.b);
  chs.forEach(c => { const w = find(new Date(c.created_at)); if (w) w.ab++; if (c.resolvido_em){ const w2 = find(new Date(c.resolvido_em)); if (w2) w2.re++; } });
  const max = Math.max(1, ...weeks.map(w => Math.max(w.ab, w.re)));
  const stepV = Math.max(1, Math.ceil(max/4)), top = stepV*4;
  const VW = 640, VH = 230, pl = 30, pb = 28, pt = 12, ch = VH-pb-pt, cw = (VW-pl)/W, bw = Math.min(18, cw/4);
  let g = '';
  for (let k = 0; k <= 4; k++){ const y = pt + ch - (k/4)*ch; g += `<line x1="${pl}" x2="${VW}" y1="${y}" y2="${y}" stroke="${k?'#f0f1f6':'#e4e6ef'}" ${k?'stroke-dasharray="3 5"':''}/><text x="${pl-8}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="10.5" fill="#9aa0b5">${k*stepV}</text>`; }
  const bar = (x, v, col, i, lbl) => { const hgt = v/top*ch; return v ? `<rect class="b" style="animation-delay:${i*60}ms" x="${x}" y="${pt+ch-hgt}" width="${bw}" height="${hgt}" rx="5" fill="${col}"><title>${lbl}: ${v}</title></rect>` : `<rect x="${x}" y="${pt+ch-2}" width="${bw}" height="2" rx="1" fill="#e4e6ef"/>`; };
  weeks.forEach((w,i) => {
    const cx = pl + cw*i + cw/2, cur = i === W-1;
    if (cur) g += `<rect x="${pl+cw*i+4}" y="${pt}" width="${cw-8}" height="${ch}" rx="10" fill="#f5f6ff"/>`;
    g += bar(cx-bw-2, w.ab, '#4f5fd8', i, 'Abertos') + bar(cx+2, w.re, '#22c55e', i, 'Resolvidos');
    g += `<text x="${cx}" y="${VH-8}" text-anchor="middle" font-size="10.5" fill="${cur?'#4f5fd8':'#9aa0b5'}" font-weight="${cur?600:400}">${cur?'Esta sem.':pad(w.a.getDate())+'/'+pad(w.a.getMonth()+1)}</text>`;
  });
  return `<svg viewBox="0 0 ${VW} ${VH}" class="bars" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Chamados por semana">${g}</svg>`;
}
function hbars(rows, emptyMsg){
  if (!rows.length) return empty('book', emptyMsg);
  const max = Math.max(1, ...rows.map(r => r.total));
  return `<div class="hbars">${rows.map((r,i) => `<div class="hb" ${r.act||''}><span class="hb-l">${r.label}</span><div class="hb-t">${r.parts.map(p => p.n ? `<i style="--c:${p.color};flex:${p.n}" title="${esc(p.name)}: ${p.n}"></i>` : '').join('')}<span style="flex:${max - r.total}"></span></div><b>${r.total}</b></div>`).join('')}</div>`;
}
function heatmap(){
  const s0 = startOfWeek(new Date()), today = iso(new Date()); const days = [];
  for (let i = 0; i < 28; i++){ const d = addDays(s0, i), ds = iso(d); days.push({d, ds, n:ausentesEm(ds).size}); }
  const max = Math.max(1, ...days.map(x => x.n));
  return `<div class="heat">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(w => `<span class="hw">${w}</span>`).join('')}${days.map(x => {
    const p = x.n ? Math.round(18 + (x.n/max)*72) : 0; const past = x.ds < today;
    return `<button class="hc ${past?'past':''} ${x.ds===today?'now':''} ${p>55?'dark':''}" style="--p:${p}%" data-act="cal-day" data-date="${x.ds}" title="${fmtD(x.ds)}: ${x.n} ausente(s)"><span>${x.d.getDate()}</span>${x.n?`<b>${x.n}</b>`:''}</button>`; }).join('')}</div>
    <div class="heat-leg"><span>Menos</span>${[0,25,50,75,95].map(p => `<i style="--p:${p}%"></i>`).join('')}<span>Mais ausentes</span></div>`;
}
function feedItems(chs){
  const today = iso(new Date()), out = [];
  S.veics.filter(v => ['problema','manutencao','atencao'].includes(v.status)).sort((a,b) => VORDER.indexOf(a.status)-VORDER.indexOf(b.status)).forEach(v => {
    const s = VSTATUS[v.status]; out.push({w:v.status==='problema'?0:2, icon:v.tipo==='moto'?'bike':'car', color:s.color, title:`${v.placa} — ${s.label}`, sub:v.status_obs || [v.marca,v.modelo].filter(Boolean).join(' '), act:'v-open', id:v.id, when:v.status_em});
  });
  chs.filter(c => c.status !== 'resolvido' && (c.prioridade === 'urgente' || c.prioridade === 'alta')).forEach(c => {
    out.push({w:c.prioridade==='urgente'?0:1, icon:'book', color:PRIOR[c.prioridade].color, title:c.titulo, sub:`#${c.id} — ${c.autor_nome} — ${PRIOR[c.prioridade].label}`, act:'ch-open', id:c.id, when:c.created_at});
  });
  S.eventos.filter(e => e.data_inicio <= today && e.data_fim >= today).forEach(e => {
    const o = EV[e.tipo] || EV.outro; out.push({w:3, icon:'cal', color:o.color, title:`${C(e.colaborador_id)?.nome || '—'} — ${o.label}`, sub:`Até ${fmtD(e.data_fim)}`, act:'ev-open', id:e.id, when:null});

async function saveColab(id){
  const f = formObj(); if (!f.nome) return toast('Informe o nome do colaborador.','err');
  const row = {nome:f.nome, cargo:f.cargo, matricula:f.matricula, telefone:f.telefone, email:f.email, pos:f.pos ? f.pos.replace(/\s+/g,'') : null,
    admissao:f.admissao, lider_id:f.lider_id, veiculo_id:f.veiculo_id, status:f.status||'ativo', observacoes:f.observacoes};
  try {
    if (row.veiculo_id){ const other = condutorOf(row.veiculo_id); if (other && !sameId(other.id,id)) await DB.update('colaboradores', other.id, {veiculo_id:null}); }
    if (id) await DB.update('colaboradores', id, row); else await DB.insert('colaboradores', row);
    closeModal(); toast(id ? 'Colaborador atualizado.' : 'Colaborador cadastrado.'); await reload();
  } catch(e){ err(e); }
}
async function delColab(id){
  const c = C(id); if (!c) return;
  if (!await confirmBox(`Excluir <b>${esc(c.nome)}</b>?<br><span class="muted">As ausências dele no calendário também serão removidas.</span>`)) return;
  try { await DB.remove('colaboradores', id); closeModal(); toast('Colaborador excluído.'); await reload(); } catch(e){ err(e); }
}
function exportColabs(){

}

function openStatusPop(btn, vid){
  const ex = $('#pop'); if (ex && ex.dataset.id === String(vid)){ closePop(); return; }
  closePop();
  const v = V(vid); if (!v) return;
  const el = document.createElement('div'); el.className = 'pop'; el.id = 'pop'; el.dataset.id = vid;
  el.innerHTML = `<h5>Situação de ${esc(v.placa)}</h5><textarea id="popobs" placeholder="Observação (opcional): ex. pneu furado, barulho no motor...">${esc(v.status_obs||'')}</textarea>
    ${Object.entries(VSTATUS).map(([k,o]) => `<button class="pop-opt ${v.status===k?'cur':''}" style="--c:${o.color}" data-act="v-set" data-id="${vid}" data-k="${k}"><i class="d"></i><div><b>${o.label}</b><small>${o.desc}</small></div>${v.status===k?ic('check',16):''}</button>`).join('')}`;
  document.body.appendChild(el);
  const r = btn.getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight;
  let top = r.bottom + 6, left = Math.min(Math.max(8, r.right - w), window.innerWidth - w - 8);
  if (top + hh > window.innerHeight - 8) top = Math.max(8, r.top - hh - 6);
  el.style.top = top + 'px'; el.style.left = left + 'px';
}
async function setVeicStatus(id, k){
  const v = V(id); if (!v) return;
  let obs = ($('#popobs')?.value || '').trim() || null;
  if (k === 'ok' && obs === v.status_obs) obs = null;
  closePop();
  const inModal = !!$('#ov');
  const patch = {status:k, status_obs:obs, status_em:nowISO(), status_por:S.profile.nome};
  Object.assign(v, patch); if (!inModal) render();

async function saveVeic(id){
  const f = formObj(); const placa = String(f.placa||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if (!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(placa)) return toast('Placa inválida. Use ABC1D23 ou ABC1234.','err');
  if (!f.modelo) return toast('Informe o modelo do veículo.','err');
  if (S.veics.some(v => v.placa===placa && !sameId(v.id,id))) return toast('Já existe um veículo com essa placa.','err');
  const old = id ? V(id) : null;
  const row = {tipo:f.tipo||'carro', placa, marca:f.marca, modelo:f.modelo, ano:f.ano?parseInt(f.ano):null, cor:f.cor, km:f.km?parseInt(f.km):null, status:f.status||'ok', observacoes:f.observacoes};
  const stChanged = !old || old.status !== row.status;
  if (stChanged){ row.status_em = nowISO(); row.status_por = S.profile.nome; row.status_obs = null; }
  try {
    let vid = id;
    if (id) await DB.update('veiculos', id, row); else vid = (await DB.insert('veiculos', row)).id;
    if (stChanged) await DB.insert('veiculo_historico', {veiculo_id:vid, status:row.status, obs: old ? 'Alterado no cadastro' : 'Veículo cadastrado', por_id:S.profile.id, por_nome:S.profile.nome});

      if (want) await DB.update('colaboradores', want, {veiculo_id:vid});
    }
    closeModal(); toast(id ? 'Veículo atualizado.' : 'Veículo cadastrado.'); await reload();
  } catch(e){ err(e); }
}

  }
  openModal({title: id ? 'Editar ausência' : 'Marcar ausência', body:`<form id="mf" class="form" autocomplete="off">
    ${fld('Colaborador', `<select name="colaborador_id" required><option value="">Selecione...</option>${opts(colabsSorted().filter(c=>c.status!=='desligado'||sameId(c.id,e.colaborador_id)).map(c=>[c.id,c.nome]), e.colaborador_id)}</select>`, true, true)}
    ${fld('Tipo', rchips('tipo',EV,e.tipo), true, true)}
    ${fld('Data inicial', inp('data_inicio',e.data_inicio,'type="date" required'), false, true)}
    ${fld('Data final', inp('data_fim',e.data_fim,'type="date" required'), false, true, 'Para um dia só, repita a data inicial.')}
    ${fld('Observação', `<textarea name="observacao" rows="3" placeholder="Ex: consulta às 14h, CID informado, folga compensatória...">${esc(e.observacao||'')}</textarea>`, true)}
    ${id?`<p class="f-hint full">Registrado por ${esc(e.criado_por_nome||'—')} em ${fmtDT(e.created_at)}</p>`:''}
  </form>`, foot:`${id?`<button class="btn danger left" data-act="ev-del" data-id="${id}">${ic('trash',15)}Excluir</button>`:''}<button class="btn" data-act="modal-close">Cancelar</button><button class="btn pri" data-act="ev-save" data-id="${id||''}">${ic('check',15)}Salvar</button>`,
    onMount: ov => { const a = $('[name=data_inicio]',ov), b = $('[name=data_fim]',ov); a.addEventListener('change', () => { if (!b.value || b.value < a.value) b.value = a.value; }); }});
}
async function saveEv(id){
  const f = formObj();
  if (!f.colaborador_id) return toast('Selecione o colaborador.','err');
  if (!f.data_inicio || !f.data_fim) return toast('Informe as datas.','err');
  if (f.data_fim < f.data_inicio) return toast('A data final não pode ser antes da inicial.','err');
  const clash = S.eventos.find(e => !sameId(e.id,id) && sameId(e.colaborador_id,f.colaborador_id) && e.data_inicio<=f.data_fim && e.data_fim>=f.data_inicio);
  if (clash && !await confirmBox(`${esc(C(f.colaborador_id)?.nome)} já tem <b>${EV[clash.tipo].label}</b> em ${rangeTxt(clash.data_inicio,clash.data_fim)}. Salvar mesmo assim?`,'Salvar')) return;
  const row = {colaborador_id:f.colaborador_id, tipo:f.tipo||'outro', data_inicio:f.data_inicio, data_fim:f.data_fim, observacao:f.observacao};
  try {
    if (id) await DB.update('eventos', id, row);
    else await DB.insert('eventos', {...row, criado_por:S.profile.id, criado_por_nome:S.profile.nome});
    closeModal(); toast('Ausência salva no calendário.');
    const d = parseISO(f.data_inicio); if (S.page === 'calendario'){ S.cal.y = d.getFullYear(); S.cal.m = d.getMonth(); }
    await reload();
  } catch(e){ err(e); }
}
async function delEv(id){
  if (!await confirmBox('Excluir esta ausência do calendário?')) return;
  try { await DB.remove('eventos', id); closeModal(); toast('Ausência excluída.'); await reload(); } catch(e){ err(e); }
}

/* ========================= USUÁRIOS ========================= */
function pgUsers(){
  if (!isAdmin()) return go('dashboard');
  const list = S.profiles.slice().sort((a,b) => (a.role==='pendente'?0:1)-(b.role==='pendente'?0:1) || a.nome.localeCompare(b.nome,'pt'));
  const pend = list.filter(p => p.role==='pendente').length;
  $('#page').innerHTML = `
  <div class="card"><div class="card-b"><div class="info-row">${ic('shield',22)}<div><b>Como dar acesso a um líder</b>
    <p>${DEMO ? 'No modo demonstração você cria usuários aqui mesmo. Com o Supabase configurado, a pessoa abre o link do painel e clica em <b>Criar conta</b>.' : 'Envie o link do painel. A pessoa clica em <b>Criar conta</b> na tela de entrada e aparece aqui como <b>Aguardando</b>.'}
    Mude o perfil para <b>Líder</b> para liberar. Líderes registram ocorrências no diário, marcam ausências e atualizam a situação da frota. Cadastrar e editar colaboradores e veículos e responder chamados é exclusivo do administrador.</p></div></div></div></div>
  <div class="card" style="margin-top:18px"><div class="card-h"><h3>Usuários (${list.length})${pend?` <span class="chip" style="--c:#f5a623;margin-left:6px">${pend} aguardando</span>`:''}</h3>${DEMO?`<button class="btn pri sm" data-act="u-new">${ic('plus',14)}Novo usuário</button>`:''}</div>
  <div class="card-b"><div class="tbl-wrap"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Acesso ativo</th><th class="hide-m">Registros no diário</th><th class="hide-m">Cadastro</th></tr></thead><tbody>
  ${list.map(p => `<tr><td><div class="who">${avatar(p.nome)}<div style="min-width:0"><b>${esc(p.nome)}${sameId(p.id,S.profile.id)?' <span class="muted">(você)</span>':''}</b><small>${esc(p.email||'')}</small></div></div></td>
    <td><select class="sel sm" data-chg="u-role" data-id="${p.id}" aria-label="Perfil">${opts([['admin','Administrador'],['lider','Líder'],['pendente','Aguardando']],p.role)}</select></td>
    <td><label class="sw" title="${p.ativo?'Ativo':'Bloqueado'}"><input type="checkbox" data-chg="u-ativo" data-id="${p.id}" ${p.ativo?'checked':''}><span></span></label></td>
    <td class="hide-m">${S.chamados.filter(c=>sameId(c.autor_id,p.id)).length}</td><td class="hide-m">${fmtD(p.created_at)}</td></tr>`).join('')}
  </tbody></table></div></div></div>`;
}
const CHG = {
  'u-role': async t => {
    if (sameId(t.dataset.id,S.profile.id) && t.value !== 'admin'){ toast('Você não pode tirar o próprio acesso de administrador.','err'); t.value = 'admin'; return; }
    try { await DB.update('profiles', t.dataset.id, {role:t.value}); toast('Perfil atualizado.'); await reload(); } catch(e){ err(e); reload(); }
  },
  'u-ativo': async t => {
    if (sameId(t.dataset.id,S.profile.id) && !t.checked){ toast('Você não pode bloquear o próprio acesso.','err'); t.checked = true; return; }
    try { await DB.update('profiles', t.dataset.id, {ativo:t.checked}); toast(t.checked ? 'Acesso liberado.' : 'Acesso bloqueado.'); await reload(); } catch(e){ err(e); reload(); }
  }
};
function userForm(){
  openModal({title:'Novo usuário (demonstração)', body:`<form id="mf" class="form">${fld('Nome', inp('nome','','required'), true, true)}${fld('E-mail', inp('email','','type="email"'), true)}${fld('Perfil', rchips('role',{lider:{label:'Líder',color:'#4f5fd8'},admin:{label:'Administrador',color:'#d94ee8'}},'lider'), true)}</form>`,
    foot:`<button class="btn" data-act="modal-close">Cancelar</button><button class="btn pri" data-act="u-save">Criar usuário</button>`});
}
async function saveUser(){
  const f = formObj(); if (!f.nome) return toast('Informe o nome.','err');
  try { await DB.insert('profiles', {nome:f.nome, email:f.email, role:f.role||'lider', ativo:true}); closeModal(); toast('Usuário criado.'); await reload(); } catch(e){ err(e); }
}

/* ========================= LOGIN / SESSÃO ========================= */
function renderLogin(msg=''){
  S.profile = null; closeModal(); closePop();
  let inner;
  if (DEMO){
    const ps = Store.load().profiles;
    inner = `<div class="notice">${ic('info',16)}<div><b>Modo demonstração.</b> Os dados ficam só neste navegador. Para usar com a equipe, preencha <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> no início do arquivo.</div></div>
      <p class="lbl">Entrar como:</p>
      <div class="demo-list">${ps.map(p => `<button class="demo-btn" data-act="demo-login" data-id="${p.id}">${avatar(p.nome,36)}<div><b>${esc(p.nome)}</b><small>${ROLE[p.role]}${p.ativo?'':' — bloqueado'}</small></div>${ic('chevR',16)}</button>`).join('')}</div>
      <button class="linkbtn" data-act="demo-reset" style="margin-top:12px">Restaurar dados de exemplo</button>`;
  } else {
    inner = `<div class="seg full" id="lmode"><button class="on" data-m="in" type="button">Entrar</button><button data-m="up" type="button">Criar conta</button></div>
      <form id="lf" class="lform">
        <div class="f up" hidden><label>Nome completo</label><input name="nome" autocomplete="name"></div>
        <div class="f"><label>E-mail</label><input name="email" type="email" required autocomplete="email"></div>
        <div class="f"><label>Senha</label><input name="senha" type="password" required minlength="6" autocomplete="current-password"></div>
        <div class="lmsg" id="lmsg">${esc(msg)}</div>
        <button class="btn pri full" type="submit" id="lbtn">Entrar</button>
        <button type="button" class="linkbtn" id="lforgot">Esqueci minha senha</button>
      </form>`;
  }
  $('#root').innerHTML = `<div class="login"><div class="card lcard"><div class="brand"><span class="logo">pc</span><div><b>Painel de Controle</b><small>Equipe, frota e diário de bordo</small></div></div>${inner}</div></div>`;
  if (!DEMO) bindLogin();
}
function bindLogin(){
  let mode = 'in';
  $$('#lmode button').forEach(b => b.onclick = () => {
    mode = b.dataset.m; $$('#lmode button').forEach(x => x.classList.toggle('on', x === b));
    $$('.up').forEach(x => x.hidden = mode !== 'up'); $('#lbtn').textContent = mode === 'in' ? 'Entrar' : 'Criar conta';
    $('#lforgot').hidden = mode !== 'in'; $('#lmsg').textContent = '';
  });
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const f = formObj('#lf'), m = $('#lmsg'), btn = $('#lbtn'); m.className = 'lmsg'; m.textContent = ''; btn.disabled = true;
    try {
      if (mode === 'in'){
        const {data, error} = await sb.auth.signInWithPassword({email:f.email, password:f.senha}); if (error) throw error;
        await afterLogin(data.user);
      } else {
        if (!f.nome) throw new Error('Informe seu nome completo.');
        const {data, error} = await sb.auth.signUp({email:f.email, password:f.senha, options:{data:{nome:f.nome}, emailRedirectTo:location.href.split('#')[0]}});
        if (error) throw error;
        if (data.session) await afterLogin(data.user);
        else { m.className = 'lmsg ok'; m.textContent = 'Conta criada! Abra o link enviado ao seu e-mail para confirmar e depois entre.'; }
      }
    } catch(er){ m.className = 'lmsg'; m.textContent = traduz(er.message); }
    finally { if (document.body.contains(btn)) btn.disabled = false; }
  };
  $('#lforgot').onclick = async () => {
    const email = $('#lf [name=email]').value.trim(), m = $('#lmsg');
    if (!email){ m.className = 'lmsg'; m.textContent = 'Digite seu e-mail acima e clique de novo em "Esqueci minha senha".'; return; }
    const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo:location.href.split('#')[0]});
    m.className = 'lmsg ' + (error ? '' : 'ok'); m.textContent = error ? traduz(error.message) : 'Enviamos um link para redefinir a senha.';
  };
}
function renderPending(){
  const blocked = S.profile && !S.profile.ativo;
  $('#root').innerHTML = `<div class="login"><div class="card lcard center"><div class="pend-ico">${ic(blocked?'shield':'clock',28)}</div>
    <h2>${blocked?'Acesso bloqueado':'Acesso aguardando liberação'}</h2>
    <p class="muted" style="line-height:1.6">Olá${S.profile?', '+esc(firstName(S.profile.nome)):''}! ${blocked?'Seu acesso foi bloqueado pelo administrador.':'Seu cadastro foi recebido. O administrador precisa liberar seu perfil para você usar o painel.'}</p>
    <div class="row-c"><button class="btn" data-act="logout">Sair</button><button class="btn pri" data-act="recheck">Verificar novamente</button></div></div></div>`;
}
async function afterLogin(user){
  try {
    if (DEMO){ S.profile = Store.load().profiles.find(p => sameId(p.id,user.id)); try{ sessionStorage.setItem('pc_demo_user', user.id); }catch(e){} }
    else {
      const {data, error} = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if (error) throw error;
      if (!data){ S.profile = {nome:user.email, role:'pendente', ativo:true}; return renderPending(); }
      S.profile = data;
    }
    if (!S.profile || S.profile.role === 'pendente' || !S.profile.ativo) return renderPending();
    const h = location.hash.slice(1); if (PAGES[h]) S.page = h;
    await loadAll(); render(); subscribeRealtime();
  } catch(e){ err(e); renderLogin(traduz(e.message)); }
}
let rtTimer = null;
function subscribeRealtime(){
  if (DEMO || S.rt) return;
  S.rt = sb.channel('painel-controle').on('postgres_changes', {event:'*', schema:'public'}, () => {
    clearTimeout(rtTimer);
    rtTimer = setTimeout(async () => { if (!S.profile) return; if ($('#ov')){ S.stale = true; return; } await loadAll(); if ($('#rail')) render(); }, 500);
  }).subscribe();
}
async function logout(){
  if (S.rt){ try { sb.removeChannel(S.rt); } catch(e){} S.rt = null; }
  if (!DEMO) await sb.auth.signOut();
  try { sessionStorage.removeItem('pc_demo_user'); } catch(e){}
  renderLogin();
}
function askNewPassword(){
  openModal({title:'Definir nova senha', body:`<form id="mf" class="form">${fld('Nova senha', inp('senha','','type="password" minlength="6" required'), true, true)}</form>`,
    foot:`<button class="btn pri" data-act="pw-save">Salvar senha</button>`});
}

/* ========================= Ações (cliques) ========================= */
const ACT = {
  'modal-close': () => closeModal(),
  'logout': () => logout(),
  'copy': a => copyText(a.dataset.v),
  'mtab': a => { const m = a.closest('.modal'); $$('.mtab',m).forEach(b => b.classList.toggle('on', b === a)); $$('[data-pane]',m).forEach(p => p.hidden = p.dataset.pane !== a.dataset.k); },
  'dash-tab': a => { S.f.dash = a.dataset.k; render(); },
  'dash-go': a => { const k = a.dataset.k, t = S.f.dash;
    if (t === 'frota'){ S.f.vs = k; go('frota'); } else if (t === 'equipe'){ S.f.cs = k; go('colaboradores'); }
    else if (t === 'chamados'){ S.f.ts = k; go('diario'); } else { const d = new Date(); S.cal.y = d.getFullYear(); S.cal.m = d.getMonth(); S.cal.tipos = new Set([k]); go('calendario'); } },
  'c-fs': a => { S.f.cs = a.dataset.k; pgColab(); },
  'c-sort': a => { const c = a.dataset.col; S.sort = {col:c, dir: S.sort.col === c ? -S.sort.dir : 1}; colabList(); },
  'c-new': () => colabForm(), 'c-edit': a => colabForm(a.dataset.id), 'c-open': a => openColab(a.dataset.id),
  'c-save': a => saveColab(a.dataset.id || null), 'c-del': a => delColab(a.dataset.id), 'c-csv': () => exportColabs(),
  'v-fs': a => { S.f.vs = a.dataset.k; pgFrota(); }, 'v-ft': a => { S.f.vt = a.dataset.k; pgFrota(); },
  'v-status': a => openStatusPop(a, a.dataset.id), 'v-set': a => setVeicStatus(a.dataset.id, a.dataset.k),
  'v-open': a => openVeic(a.dataset.id), 'v-new': () => veicForm(), 'v-edit': a => veicForm(a.dataset.id),
  'v-save': a => saveVeic(a.dataset.id || null), 'v-del': a => delVeic(a.dataset.id), 'v-csv': () => exportVeics(),
  't-fs': a => { S.f.ts = a.dataset.k; pgDiario(); }, 't-fl': a => { if (a.dataset.go){ S.f.tl = a.dataset.k; S.f.ts = ''; return go('diario'); } S.f.tl = sameId(S.f.tl, a.dataset.k) ? '' : a.dataset.k; pgDiario(); },
  'dash-v': a => { S.f.vs = a.dataset.k; S.f.vt = ''; go('frota'); },
  'dash-cat': a => { S.f.tc = a.dataset.k; S.f.ts = ''; go('diario'); },
  't-new': () => chForm(), 't-save': () => saveCh(), 'ch-open': a => openCh(a.dataset.id),
  'ch-resp': a => saveResp(a.dataset.id), 'ch-resolve': a => saveResp(a.dataset.id, 'resolvido'), 'ch-del': a => delCh(a.dataset.id),
  'cal-prev': () => { const c = S.cal; c.m--; if (c.m < 0){ c.m = 11; c.y--; } pgCal(); },
  'cal-next': () => { const c = S.cal; c.m++; if (c.m > 11){ c.m = 0; c.y++; } pgCal(); },
  'cal-today': () => { const d = new Date(); S.cal.y = d.getFullYear(); S.cal.m = d.getMonth(); pgCal(); },
  'cal-type': a => { const t = S.cal.tipos, k = a.dataset.k; t.has(k) ? t.delete(k) : t.add(k); pgCal(); },
  'cal-clear': () => { S.cal.tipos.clear(); pgCal(); },
  'cal-cell': a => evForm(null, a.dataset.date), 'cal-day': a => calDay(a.dataset.date),
  'ev-new': a => evForm(null, a.dataset.date, a.dataset.col), 'ev-open': a => evForm(a.dataset.id),
  'ev-save': a => saveEv(a.dataset.id || null), 'ev-del': a => delEv(a.dataset.id),
  'u-new': () => userForm(), 'u-save': () => saveUser(),
  'demo-login': a => afterLogin({id:a.dataset.id}),
  'demo-reset': async () => { if (await confirmBox('Apagar tudo e restaurar os dados de exemplo?','Restaurar')){ Store.reset(); renderLogin(); toast('Dados de exemplo restaurados.'); } },
  'recheck': async () => { if (DEMO){ const id = S.profile?.id; return id ? afterLogin({id}) : renderLogin(); } const {data} = await sb.auth.getUser(); data?.user ? afterLogin(data.user) : renderLogin(); },
  'pw-save': async () => { const f = formObj(); if (!f.senha || f.senha.length < 6) return toast('A senha precisa ter pelo menos 6 caracteres.','err');
    const {error} = await sb.auth.updateUser({password:f.senha}); if (error) return err(error); closeModal(); toast('Senha alterada.'); }
};
document.addEventListener('click', e => {
  const pop = $('#pop');
  if (pop && !pop.contains(e.target) && !e.target.closest('[data-act="v-status"]')) closePop();
  const a = e.target.closest('[data-act]');
  if (a){ if (a.tagName === 'A') return; ACT[a.dataset.act]?.(a, e); return; }
  const n = e.target.closest('[data-nav]'); if (n) go(n.dataset.nav);
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.chg) CHG[t.dataset.chg]?.(t); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#pop')) closePop(); else closeModal(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act],[role=button][data-nav]')){ e.preventDefault(); e.target.click(); }
});
window.addEventListener('scroll', closePop, true);
window.addEventListener('resize', closePop);

/* ========================= Início ========================= */
(async function boot(){
  if (!DEMO && !sb){ $('#root').innerHTML = `<div class="login"><div class="card lcard center"><div class="pend-ico">${ic('alert',28)}</div><h2>Não foi possível conectar</h2><p class="muted">A biblioteca do Supabase não carregou. Verifique a internet e recarregue a página.</p></div></div>`; return; }
  if (DEMO){
    let id = null; try { id = sessionStorage.getItem('pc_demo_user'); } catch(e){}
    return id && Store.load().profiles.find(p => p.id === id) ? afterLogin({id}) : renderLogin();
  }
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') setTimeout(askNewPassword, 300); });
  const {data:{session}} = await sb.auth.getSession();
  session ? await afterLogin(session.user) : renderLogin();
})();
</script>
</body>
