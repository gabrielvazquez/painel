<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Controle</title>
<meta name="theme-color" content="#0a2a5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel de Controle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Crect width=%2248%22 height=%2248%22 rx=%2214%22 fill=%22%230b4ea2%22/%3E%3Cpath d=%22M24 8.5s-11.2 12.6-11.2 20.2a11.2 11.2 0 0 0 22.4 0C35.2 21.1 24 8.5 24 8.5z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f4f5fa;--card:#fff;--ink:#1d2033;--ink2:#4a4f66;--muted:#8b90a6;--line:#eceef5;--soft:#f6f7fb;
  --accent:#4f5fd8;--accent2:#3d4cc4;--accent-soft:#eef0fd;
  --green:#22c55e;--yellow:#f5a623;--red:#ef4444;--blue:#4f63d6;--gray:#94a3b8;--pink:#d94ee8;
  --shadow:0 1px 2px rgba(20,24,60,.04),0 6px 18px rgba(20,24,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)} .s{font-size:11.5px} .fw5{font-weight:500}
.mono{font-family:ui-monospace,'SF Mono',Consolas,monospace;letter-spacing:.3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.rail{width:76px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:8px;position:sticky;top:0;height:100vh;z-index:20;flex:none}
.logo{font-weight:700;font-size:25px;color:var(--accent);letter-spacing:-1px;margin-bottom:28px;line-height:1}
.nav-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:#a3a8bd;display:grid;place-items:center;position:relative;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--soft);color:var(--ink2)}
.nav-btn.on{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(79,95,216,.35)}
.nav-btn .badge{position:absolute;top:3px;right:3px;background:var(--accent);color:#fff;font-size:9px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;display:grid;place-items:center;border:2px solid #fff;font-weight:600}
.nav-btn.on .badge{background:#fff;color:var(--accent);border-color:var(--accent)}
.nav-btn .tip{position:absolute;left:56px;background:var(--ink);color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-4px);transition:.15s}
.nav-btn:hover .tip{opacity:1;transform:none}
.rail .spacer{flex:1}
.nav-btn.out{color:var(--red)} .nav-btn.out:hover{background:#fdeeee}
.main{flex:1;min-width:0;padding:22px 30px 48px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:18px;font-weight:600;margin:0}
.topbar .sub{color:var(--muted);font-size:12px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.userchip{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);padding:4px 14px 4px 4px;border-radius:30px}
.userchip b{font-weight:600;font-size:12px;display:block;line-height:1.25}
.userchip small{color:var(--muted);font-size:10.5px}
.live{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.demo-tag{background:#fff6e5;color:#a8701a;border:1px solid #fde3b0;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:500}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid #eff0f6}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:600}
.card-b{padding:18px 22px 22px}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);flex:none}
.kpi b{font-size:22px;font-weight:600;display:block;line-height:1.15}
.kpi span{color:var(--ink2);font-size:12px}
.kpi .k-sub{color:var(--muted);font-size:10.5px}

/* ---------- Hero / tabs (referência) ---------- */
.hero{display:flex;align-items:center;gap:18px;padding:4px 4px 20px}
.hero h2{margin:0;font-size:18px;font-weight:600}
.hero p{margin:4px 0 0;color:var(--muted);text-transform:none}
.tabs{display:flex;gap:6px;background:#fff;border-radius:12px;padding:0 12px;box-shadow:var(--shadow);border:1px solid #eff0f6;margin-bottom:18px;overflow-x:auto}
.tab,.mtab{border:0;background:none;padding:15px 16px 13px;color:var(--ink2);font-size:12.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on,.mtab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.mtab{padding:10px 12px}

/* ---------- Donut overview ---------- */
.overview{display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:center}
.donut-wrap{position:relative;width:260px;height:260px;margin:auto}
.donut-wrap svg{display:block}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-c small{color:var(--muted);font-size:12px}
.donut-c b{font-size:20px;font-weight:600;margin:4px 0 10px}
.donut-c hr{width:120px;border:0;border-top:1px solid var(--line);margin:0 0 10px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px 34px}
.lg{display:flex;align-items:center;gap:12px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.lg .n{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:11.5px;font-weight:500;flex:none}
.lg .p{width:36px;color:var(--muted);font-size:11.5px}
.lg .l{flex:1;font-weight:500;font-size:12px}
.lg .pill{background:var(--c);color:#fff;padding:5px 10px;border-radius:5px;font-size:11px;min-width:110px;text-align:center}
.lg:hover .l{color:var(--accent)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#f3f4f9;text-align:left;font-weight:500;font-size:11.5px;color:var(--ink2);padding:11px 12px;white-space:nowrap}
th:first-child{border-radius:8px 0 0 8px} th:last-child{border-radius:0 8px 8px 0}
th.sort{cursor:pointer;user-select:none} th .ar{opacity:.45;margin-left:5px;font-size:9px}
td{padding:13px 12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#fafbff}
td.act{text-align:right;white-space:nowrap}
.tfoot{color:var(--muted);font-size:11.5px;padding-top:12px}

/* ---------- Chips / tags ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;color:color-mix(in srgb,var(--c) 80%,#000);background:color-mix(in srgb,var(--c) 13%,#fff);white-space:nowrap;border:0;line-height:1.5}
.chip .d,.dot{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
button.chip:hover{background:color-mix(in srgb,var(--c) 22%,#fff)}
.chip .caret{font-size:8px;opacity:.7}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;color:color-mix(in srgb,var(--c) 85%,#000);background:color-mix(in srgb,var(--c) 11%,#fff)}

/* ---------- Buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:500;font-size:12.5px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:#d9dcea;background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,95,216,.28)}
.btn.pri:hover{background:var(--accent2)}
.btn.danger{color:var(--red)} .btn.danger:hover{background:#fdeeee;border-color:#f8cfcf}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.full{width:100%;justify-content:center;padding:12px}
.btn:disabled{opacity:.6;cursor:wait}
.icon-btn{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--ink2);display:inline-grid;place-items:center;vertical-align:middle}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn.xs{width:24px;height:24px}
.icon-btn.bord{border:1px solid var(--line);background:#fff}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:500;padding:8px 0;font-size:12px}
.lnk{color:var(--accent);cursor:pointer;font-weight:500}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tb-right{margin-left:auto;display:flex;gap:8px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px;flex:1;min-width:200px;max-width:380px;color:var(--muted)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;outline:0;padding:10px 0;flex:1;background:transparent;min-width:0}
.sel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;outline:0}
.sel.sm{padding:6px 10px;font-size:12px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--ink2);font-size:12px;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.seg.full{display:flex;margin-bottom:18px} .seg.full button{flex:1;justify-content:center;padding:9px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fchip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);transition:.15s}
.fchip .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.fchip b{font-weight:600;color:var(--ink)}
.fchip:hover{border-color:color-mix(in srgb,var(--c) 45%,#fff)}
.fchip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--ink)}
.hint{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;margin:-4px 0 16px}

/* ---------- Avatar ---------- */
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;background:var(--c)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:11px;display:block}
.pos{font-size:12px}

/* ---------- Placa Mercosul ---------- */
.plate{display:inline-flex;flex-direction:column;align-items:stretch;border:2px solid #23263a;border-radius:6px;overflow:hidden;background:#fff;min-width:124px;vertical-align:middle}
.plate i{display:block;background:#1e40af;color:#fff;font-style:normal;font-size:7.5px;letter-spacing:2.5px;text-align:center;padding:1.5px 0;font-weight:600}
.plate b{font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:19px;letter-spacing:2.5px;padding:3px 10px;font-weight:700;text-align:center;color:#1d2033}
.plate.mini{min-width:0;border-width:1.5px;border-radius:4px}
.plate.mini i{font-size:4.5px;letter-spacing:1px;padding:0;height:4px;line-height:4px}
.plate.mini b{font-size:11px;padding:1px 6px;letter-spacing:1px}
.vlink{display:inline-flex;align-items:center;gap:8px}

/* ---------- Frota ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.vcard{padding:16px 16px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s;border-top:3px solid var(--c)}
.vcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,24,60,.09)}
.vtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.vico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--ink2)}
.vmid{text-align:center;margin-bottom:12px}
.vmodel{font-weight:600;margin-top:10px}
.vmeta{color:var(--muted);font-size:11.5px;margin-top:2px}
.vobs{display:flex;gap:7px;align-items:flex-start;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--ink2);border-radius:8px;padding:8px 10px;font-size:11.5px;margin-bottom:10px}
.vobs svg{flex:none;margin-top:1px;color:var(--c)}
.vfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:11.5px;gap:8px}
.vupd{color:var(--muted);font-size:10.5px;margin-top:8px}

/* ---------- Popover status ---------- */
.pop{position:fixed;z-index:60;background:#fff;border-radius:12px;box-shadow:0 14px 44px rgba(20,24,60,.2);border:1px solid var(--line);padding:10px;width:262px;animation:pop .12s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.pop h5{margin:2px 6px 8px;font-size:12px;color:var(--ink);font-weight:600}
.pop textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:none;height:50px;outline:0;font-size:12px;margin-bottom:6px}
.pop textarea:focus{border-color:var(--accent)}
.pop-opt{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:8px;border-radius:8px;text-align:left}
.pop-opt:hover{background:var(--soft)}
.pop-opt .d{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,#fff);flex:none}
.pop-opt div{flex:1}
.pop-opt b{font-weight:500;display:block;font-size:12.5px}
.pop-opt small{color:var(--muted);font-size:10.5px}
.pop-opt.cur{background:var(--accent-soft)} .pop-opt.cur svg{color:var(--accent)}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;background:rgba(20,24,50,.4);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:580px;box-shadow:0 24px 70px rgba(0,0,0,.22);animation:up .18s ease}
.modal.wide{max-width:780px}
.m-h{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
.m-h h3{margin:0;font-size:15px;font-weight:600}
.m-b{padding:20px 22px}
.m-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);background:#fcfcfe;border-radius:0 0 16px 16px;flex-wrap:wrap}
.m-f .left{margin-right:auto}
.cf-ico{width:52px;height:52px;border-radius:50%;background:#fdeeee;color:var(--red);display:grid;place-items:center;margin:auto}

/* ---------- Forms ---------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:11.5px;font-weight:500;color:var(--ink2)}
.f label em{color:var(--red);font-style:normal}
.f input,.f select,.f textarea,.ta{border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;background:#fff;transition:border-color .15s,box-shadow .15s;width:100%}
.f input:focus,.f select:focus,.f textarea:focus,.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f textarea,.ta{resize:vertical;min-height:84px;line-height:1.5}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.rchip input{position:absolute;opacity:0;pointer-events:none}
.rchip span{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:7px 13px;border-radius:20px;cursor:pointer;font-size:12px;color:var(--ink2);transition:.12s}
.rchip span .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.rchip input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--ink);font-weight:500}
.rchip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.f-hint{font-size:10.5px;color:var(--muted)}

/* ---------- Detalhes ---------- */
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px}
.dl > div small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.dl > div b{font-weight:500}
.dl .full{grid-column:1/-1}
.sec{font-size:12px;font-weight:600;margin:20px 0 8px;color:var(--ink)}
.box{background:var(--soft);border-radius:10px;padding:14px;white-space:pre-wrap;line-height:1.6}
.box.resp{background:#f0fdf4;border:1px solid #d1f5dd}
.resp-by{margin-top:8px;color:var(--muted);font-size:11px}
.minicard{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.minicard:hover{background:#fafbff}
.contact{display:flex;gap:6px;margin-top:4px}
.contact a{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);text-decoration:none;background:var(--accent-soft);padding:3px 9px;border-radius:12px}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 14px}
.tl::before{content:'';position:absolute;left:-18px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff}
.tl b{font-weight:500} .tl small{display:block;color:var(--muted);font-size:11px}
.tl p{margin:4px 0 0;color:var(--ink2);font-size:12px}
.steps{display:flex;gap:0;margin-top:22px}
.step{flex:1;position:relative;padding-top:20px;text-align:center}
.step i{position:absolute;top:0;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#e4e6ef;border:3px solid #fff;box-shadow:0 0 0 1px #e4e6ef;z-index:1}
.step::before{content:'';position:absolute;top:6px;left:0;right:0;height:2px;background:#e4e6ef}
.step:first-child::before{left:50%} .step:last-child::before{right:50%}
.step.done i{background:var(--green);box-shadow:0 0 0 1px var(--green)}
.step b{display:block;font-weight:500;font-size:12px}
.step small{color:var(--muted);font-size:10.5px}
.ch-head h2{margin:0 0 10px;font-size:17px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- Diário ---------- */
.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.ld{padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;border:1px solid #eff0f6;text-align:left;background:#fff}
.ld.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ld b{font-weight:500;display:block}
.ld .nums{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:3px}
.ld .nums span{display:flex;align-items:center;gap:4px}
.tk{display:flex;gap:14px;align-items:center;padding:14px 18px 14px 20px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.tk:last-child{border-bottom:0}
.tk:hover{background:#fafbff}
.tk::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.tk .num{color:var(--muted);font-size:11.5px;width:40px;flex:none}
.tk .body{flex:1;min-width:0}
.tk .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .m{color:var(--muted);font-size:11px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.replied{color:var(--green);display:grid;place-items:center}

/* ---------- Calendário ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cal-h h2{margin:0 6px;font-size:17px;font-weight:600;min-width:170px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wd{padding:11px 6px;font-size:11px;color:var(--muted);font-weight:500;text-align:center;border-bottom:1px solid var(--line);background:#fafbfe}
.cal .day{min-height:108px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .1s}
.cal .day:nth-child(7n){border-right:0}
.cal .day:hover{background:#f8f9ff}
.cal .day.we{background:#fcfcfe}
.cal .day.out{color:#c3c6d4} .cal .day.out .ev{opacity:.55}
.cal .day .dn{font-size:11.5px;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;flex:none}
.cal .day.today .dn{background:var(--accent);color:#fff}
.ev{font-size:10.5px;padding:3px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--ink);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev:hover{background:color-mix(in srgb,var(--c) 24%,#fff)}
.more{font-size:10.5px;color:var(--accent);padding-left:4px;font-weight:500}
.agenda-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.agenda-item:last-child{border-bottom:0}
.agenda-item .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.agenda-item b{font-weight:500;display:block}
.agenda-item small{color:var(--muted);font-size:11px}
.leg-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px}
.leg-row span{display:flex;align-items:center;gap:8px}

/* ---------- Switch ---------- */
.sw{position:relative;display:inline-block;width:38px;height:22px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#dfe2ec;border-radius:22px;cursor:pointer;transition:.2s}
.sw span::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span::after{transform:translateX(16px)}
.info-row{display:flex;gap:14px;align-items:flex-start;color:var(--accent)}
.info-row b{color:var(--ink);font-weight:600}
.info-row p{margin:4px 0 0;color:var(--ink2);line-height:1.6;max-width:820px}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#e6e9fd,transparent 45%),radial-gradient(circle at 90% 90%,#fbeefa,transparent 40%),var(--bg)}
.lcard{width:100%;max-width:410px;padding:32px}
.lcard.center{text-align:center}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.brand .logo{margin:0;width:48px;height:48px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:21px}
.brand b{font-size:16px;font-weight:600;display:block}
.brand small{color:var(--muted);font-size:11.5px}
.lform{display:flex;flex-direction:column;gap:14px}
.lmsg{font-size:12px;color:var(--red);min-height:0}
.lmsg.ok{color:#15803d}
.notice{display:flex;gap:10px;background:#fff8ea;border:1px solid #fde3b0;border-radius:10px;padding:12px;font-size:11.5px;line-height:1.55;color:#7a5410;margin-bottom:18px}
.notice svg{flex:none;margin-top:1px}
.notice code{background:#fff;padding:1px 5px;border-radius:4px;font-size:10.5px}
.demo-list{display:flex;flex-direction:column;gap:8px}
.demo-btn{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;transition:.15s}
.demo-btn:hover{border-color:var(--accent);background:#fafbff}
.demo-btn div{flex:1} .demo-btn b{font-weight:500;display:block} .demo-btn small{color:var(--muted);font-size:11px}
.lbl{font-size:12px;font-weight:500;color:var(--ink2);margin:0 0 10px}
.pend-ico{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px}
.lcard h2{font-size:17px;font-weight:600;margin:0 0 8px}
.row-c{display:flex;gap:10px;justify-content:center;margin-top:20px}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Toast / vazio ---------- */
.toasts{position:fixed;bottom:20px;right:20px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;align-items:center;gap:9px;animation:up .2s;transition:.25s;max-width:380px}
.toast.err{background:#c2312f}
.toast.ok .i{color:#4ade80}
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty .i{width:56px;height:56px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 12px;color:#b4b8cc}
.empty b{display:block;color:var(--ink2);font-weight:500;margin-bottom:4px}

/* ---------- Responsivo ---------- */
@media (max-width:1150px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.overview{grid-template-columns:1fr}.cal-wrap{grid-template-columns:1fr}.two{grid-template-columns:1fr!important}}
@media (max-width:720px){
  .app{flex-direction:column}
  .rail{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:64px;flex-direction:row;justify-content:space-around;padding:0 6px;border-right:0;border-top:1px solid var(--line)}
  .rail .logo,.rail .spacer{display:none}
  .nav-btn .tip{display:none}
  .main{padding:16px 14px 92px}
  .topbar .right .live,.userchip div{display:none}
  .userchip{padding:4px}
  .form,.dl{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px;gap:10px} .kpi .ico{width:38px;height:38px} .kpi b{font-size:18px}
  .cal .day{min-height:62px;padding:4px}
  .ev{font-size:0;height:5px;padding:0;border-left:0;background:var(--c)}
  .more{font-size:9px;padding:0}
  .hide-m{display:none}
  .tb-right{margin-left:0}
  .donut-wrap{transform:scale(.85)}
  .toasts{left:14px;right:14px;bottom:80px;align-items:stretch}
}

.dhero p{margin:8px 0 22px;color:#bfc4f0;font-size:14px;line-height:1.6;max-width:640px}

.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;margin-top:18px}
.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.ch-sub{margin:3px 0 0;color:var(--muted);font-size:11.5px}
.dgrid .card-h{align-items:flex-start}

.k2 > div:first-child{min-width:0}
.k2{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:transform .15s,box-shadow .15s}

.k2-l{overflow:hidden;text-overflow:ellipsis}
.k2-v{display:block;font-size:30px;font-weight:600;letter-spacing:-.8px;margin:8px 0 4px;line-height:1}

.mini-seg{display:flex;gap:3px;height:8px;margin:2px 0 8px}

.ring,.spark{flex:none}

.gauge-wrap{position:relative;max-width:260px;margin:4px auto 0}
.gauge{display:block;width:100%}
.gauge-c{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gauge-c b{display:block;font-size:34px;font-weight:600;letter-spacing:-1px;line-height:1}
.gauge-c span{color:var(--muted);font-size:11.5px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 0 14px;border:1px solid var(--line);border-radius:12px}
.trio div{padding:10px;text-align:center}

.dhero p{color:rgba(255,255,255,.78)!important}
.hbtn.pri{color:var(--hero)!important}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:24px 0 12px}
.sec-h h3{margin:0;font-size:15px;font-weight:600}
.sec-h span{color:var(--muted);font-size:11.5px}
.bcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.bcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;text-align:left;border:1px solid #eff0f6;background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.bcard::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.bcard:hover{transform:translateY(-2px);box-shadow:0 14px 30px color-mix(in srgb,var(--c) 18%,transparent)}
.bc-top{display:flex;align-items:center;gap:11px}
.bc-top b{display:block;font-size:14.5px;font-weight:600;color:var(--d)}
.bc-top small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.bc-nums{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px;font-size:10.5px;color:var(--muted)}
.bc-nums b{display:block;font-size:18px;font-weight:600;color:var(--ink);line-height:1.1}
.bc-nums b small{font-size:11px;color:var(--muted);font-weight:500}
.bc-nums .hot b{color:var(--red)}
.bc-bar{display:block;height:6px;border-radius:4px;background:var(--s)}
.bc-bar i{display:block;height:100%;border-radius:4px;background:var(--c)}
.yt-top{align-items:center;gap:6px}
.yt-top > svg{margin-right:auto}
.yt-b{width:8px;height:8px;border-radius:2px;background:var(--b)}

.heat .hc{background:color-mix(in srgb,var(--accent) var(--p),#f3f4f9)!important}
.heat .hc.now{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)!important}
.heat-leg i{background:color-mix(in srgb,var(--accent) var(--p),#f3f4f9)!important}
.nav-btn.on{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 38%,transparent)!important}
.nav-btn.on .badge{color:var(--accent)!important;border-color:var(--accent)!important}
.btn.pri{box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)!important}

.dtabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.dtab{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 18px;text-align:left;position:relative;transition:border-color .15s,box-shadow .15s}
.dtab .dt-i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--ink2);flex:none}
.dtab b{display:block;font-weight:600;font-size:13.5px}
.dtab small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.dtab em{position:absolute;top:12px;right:14px;font-style:normal;background:var(--accent);color:#fff;font-size:11px;font-weight:600;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.dtab.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dtab.on .dt-i{background:var(--accent);color:#fff}
.mcount{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:11.5px;font-weight:500}
.mcount.new{color:var(--accent)}
.mcount.new::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}
.late{color:var(--red)!important;font-weight:500}
.thread{display:flex;flex-direction:column;gap:12px;max-height:340px;overflow-y:auto;padding:4px 2px 12px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.msg.me{flex-direction:row-reverse;align-self:flex-end}
.bub{background:var(--soft);border-radius:14px 14px 14px 4px;padding:9px 13px}
.msg.me .bub{border-radius:14px 14px 4px 14px;background:var(--accent-soft)}
.msg.g:not(.me) .bub{background:#f0f6ff;border:1px solid #dbe7fb}
.mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mh b{font-weight:600;font-size:12px}
.mh small{color:var(--muted);font-size:10.5px}
.gtag{font-size:9.5px;font-weight:600;background:#0b4ea2;color:#fff;padding:1px 7px;border-radius:8px}
.bub p{margin:4px 0 0;white-space:pre-wrap;line-height:1.55;font-size:12.5px}
.fixed-base{padding:7px 0}
.tag svg{vertical-align:-1px}

.imp-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.imp-step{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}
.imp-step > span{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.imp-step b{font-weight:600;font-size:12.5px}
.imp-step p{margin:3px 0 8px;color:var(--muted);font-size:11.5px;line-height:1.45}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #d6d9e6;border-radius:14px;padding:26px;cursor:pointer;color:var(--muted);text-align:center;transition:border-color .15s,background .15s}
.drop b{color:var(--ink);font-weight:500}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.imp-sum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 10px}
.imp-f{display:inline-flex;align-items:center;gap:6px;font-weight:500;margin-right:6px}
.imp-base{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:12px;flex-wrap:wrap}
.imp-tbl{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.imp-tbl th{position:sticky;top:0;border-radius:0!important;z-index:1}
.imp-tbl td{padding:9px 12px}
.imp-tbl tr.bad td{background:#fff6f6}
.imp-tbl .e{color:var(--red)} .imp-tbl .w{color:#a8701a}
.imp-err{display:flex;gap:8px;align-items:center;color:var(--red);background:#fdeeee;border-radius:10px;padding:12px;margin-top:14px}

.cover{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.cv{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px}
.cv b{display:block;font-weight:600;font-size:12.5px}
.cv small{color:var(--muted);font-size:11px}
.cv.none small{color:var(--red)}
.bpick{display:flex;flex-wrap:wrap;gap:6px}
.bp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px 3px 3px;font-size:11.5px;color:var(--muted);transition:.12s}
.bp .emb{filter:grayscale(1);opacity:.45}
.bp.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--ink);font-weight:500}
.bp.on .emb{filter:none;opacity:1}
.utbl tr.pend td{background:#fffbf2}

.login .lcard{max-width:440px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:0}
.brand .wm b{font-size:22px}
.lfoot{text-align:center;color:var(--muted);font-size:11px;margin-top:14px}
.login{flex-direction:column;display:flex!important;align-items:center;justify-content:center}
.lbases{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lb input{position:absolute;opacity:0;pointer-events:none}
.lb span{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;padding:7px 10px;cursor:pointer;font-size:12.5px;font-weight:500;transition:.12s}
.lb input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 15%,transparent)}
.lb input:focus-visible+span{outline:2px solid var(--c);outline-offset:2px}
.chk{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.chk li{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:9px 12px;border-radius:10px;background:var(--soft)}
.chk li.ok svg{color:var(--green)} .chk li.no{background:#fdeeee} .chk li.no svg{color:var(--red)}
.chk code{background:#fff;padding:1px 5px;border-radius:4px;font-size:11px}
.lcard.center-l{text-align:left}
.lcard .pend-ico{margin-top:4px}

@media (max-width:1250px){.bcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){
  .bcards,.cover{grid-template-columns:1fr 1fr;gap:10px}
  .bcard{padding:12px}.bc-nums b{font-size:15px}
  .dtabs{grid-template-columns:1fr}
  .imp-steps{grid-template-columns:1fr}
  .dhero-emb{right:-40px}
  .tb-brand{display:none}
  .bs{padding:6px 12px 6px 6px}.bs small{display:none}
  .lbases{grid-template-columns:1fr 1fr}
}

/* ================= v2.1 ================= */
.emb{display:inline-block;flex:none;vertical-align:middle}
.btag{padding:3px 10px 3px 8px}
.btag .emb{width:8px!important;height:8px!important;border-radius:50%!important}
.mine{font-style:normal;font-size:9.5px;font-weight:600;background:var(--c);color:#fff;padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:1px}
button.live{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:11px;color:var(--ink2);cursor:pointer;transition:background .15s}
button.live:hover{background:var(--soft)}
button.live.off{border-color:#f8cfcf;background:#fdeeee;color:#b42318;font-weight:500}
.bell{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink2)}
.bell:hover{background:var(--soft)}
.bell.has{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,#fff)}
.bell .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:600;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.tb-logo-m{display:none}
.npanel{position:fixed;top:72px;right:24px;width:390px;max-height:min(70vh,620px);background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(20,24,60,.22);border:1px solid var(--line);z-index:65;display:flex;flex-direction:column;animation:pop .14s ease}
.np-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.np-h b{font-size:14px;font-weight:600;margin-right:auto}
.np-b{overflow-y:auto;padding:6px 8px 12px}
.np-s{font-size:11px;font-weight:600;color:var(--muted);padding:12px 8px 6px;display:flex;align-items:center;gap:6px}
.np-s em{font-style:normal;background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:10px}
.np-empty{color:var(--muted);font-size:12px;padding:4px 8px 6px;margin:0}
.ni{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:9px 8px;border-radius:10px;position:relative}
.ni:hover{background:var(--soft)}
.ni.unread{background:color-mix(in srgb,var(--accent) 6%,#fff)}
.ni.unread::after{content:'';position:absolute;left:2px;top:50%;width:5px;height:5px;border-radius:50%;background:var(--accent);transform:translateY(-50%)}
.ni-i{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);flex:none}
.ni-t{flex:1;min-width:0}
.ni-t b{display:block;font-weight:500;font-size:12.5px;line-height:1.3}
.ni-t small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-w{color:var(--muted);font-size:10.5px;white-space:nowrap}

.pipe{display:inline-flex;gap:3px;margin-right:8px;vertical-align:middle}
.pipe i{width:14px;height:5px;border-radius:3px;background:#e4e6ef}
.pipe i.on{background:var(--c)}
.tk-st{display:flex;align-items:center;white-space:nowrap}
.qbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid color-mix(in srgb,var(--accent) 35%,#fff);background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:6px 10px;font-size:11.5px;font-weight:500;white-space:nowrap}
.qbtn:hover{background:var(--accent);color:#fff}
.qbtn.ok{border-color:#bfe9cf;background:#ecfdf3;color:#15803d}
.qbtn.ok:hover{background:#16a34a;color:#fff}
.seen{color:#16a34a;display:inline-flex;align-items:center;gap:3px;font-weight:500}
.whohandles{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--ink2);margin-top:14px}
.whohandles b{color:var(--ink)}
.ch-head .chips{width:100%}
.ld .ld-b{display:block;color:var(--muted);font-size:10.5px}
.steps{margin-top:18px!important}

.upl{display:flex;align-items:center;gap:9px;border:1.5px dashed #d6d9e6;border-radius:10px;padding:11px 14px;cursor:pointer;color:var(--ink2);font-size:12.5px;transition:.15s}
.upl:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.anx{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.anx-i{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;text-align:left;color:var(--accent)}
.anx-i b{display:block;color:var(--ink);font-weight:500;font-size:12.5px}
.anx-i small{color:var(--muted);font-size:11px}
.anx-i:hover{background:var(--soft)}
.anx-i.gone{opacity:.6}
.clip{color:var(--muted);margin-right:6px;display:grid;place-items:center}
.anx-top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.anx-top div{background:var(--soft);border-radius:12px;padding:12px}
.anx-top b{display:block;font-size:18px;font-weight:600}
.anx-top span{color:var(--muted);font-size:11px}
.qz{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.qz.cur{border-color:color-mix(in srgb,var(--accent) 35%,#fff)}
.qz-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qz-h > div:first-child{flex:1;min-width:180px}
.qz-h b{display:block;font-weight:600}
.qz-h small{color:var(--muted);font-size:11.5px}
.qz-a{display:flex;gap:6px;align-items:center}
.qz details{margin-top:8px}
.qz summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:500}
.qz-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.qz-f small{color:var(--muted)}
.bp.taken:not(.on){border-style:dashed}
.btn.danger:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Celular ---------- */

  .topbar .right .live i{width:10px;height:10px;display:block}
  .userchip{padding:3px;border:0;background:none}
  .bswitch{margin:0 -12px 14px;padding:2px 12px 6px}
  .bs{padding:7px 12px 7px 8px;border-radius:12px}
  .npanel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:82vh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}

  .m-h{padding:14px 16px}
  .m-b{overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
  .m-f{border-radius:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));gap:8px}

  .m-f .left{flex:0 0 auto}
  .pop{left:8px!important;right:8px;width:auto}
  .toolbar{gap:8px}
  .search{max-width:none;min-width:0;flex:1 1 100%}
  .toolbar .sel{flex:1}
  .tb-right{margin-left:auto;flex-wrap:wrap}
  .hide-s{display:none}
  .btn{min-height:40px}
  .seg-st{width:100%;overflow-x:auto}
  .seg-st button{flex:1;white-space:nowrap}
  .filters{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 14px;padding:0 12px 4px}

  table.mcards td[data-l]:not([data-l=""])::before{content:attr(data-l);color:var(--muted);font-size:10.5px}
  table.mcards td.mc-main{flex:1 1 100%}
  table.mcards td.mc-act{position:absolute;top:8px;right:0}
  table.mcards td.hide-m{display:none}
  .tk{flex-wrap:wrap;padding:12px 12px 12px 16px;gap:8px 10px}

  .tk-st{margin-left:auto}
  .qbtn{padding:8px 12px}
  .dtab{padding:12px}
  .dtab small{display:none}

  .kpi,.k2{padding:14px}

/* ================= v2.2: escalas + celular reforçado ================= */
[data-act],[data-nav],label.rchip,label.pk,label.lb,label.upl,label.drop{cursor:pointer}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,[data-act],[data-nav],label,input,select,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.userchip{cursor:pointer}
.ov{top:0;left:0;right:0;bottom:0;overscroll-behavior:contain}
.m-only,.lbl-m{display:none}

.esc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.esc-head .cal-h h2{min-width:150px}
.sat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sat-c{display:flex;flex-direction:column;gap:8px;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-height:96px}
.sat-c.empty{border-style:dashed;border-left-style:solid;background:#fffafa}
.sat-h{display:flex;align-items:center;gap:7px}
.sat-h b{font-weight:600;font-size:13px;margin-right:auto}
.sat-h .emb{border-radius:50%!important}
.sat-t{font-size:11.5px;color:var(--muted)}
.sat-e{display:flex;align-items:center;gap:6px;color:#b42318;font-size:12px;font-weight:500}
.sat-go{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:600;font-size:12px}

.ffpl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ffp{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.ffp > span{display:flex;align-items:center;gap:8px;flex:1 1 160px;min-width:140px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ffp > span .av{flex:none}
.ffp .tgl{flex:none;color:var(--ink2)!important;font-size:12px;display:flex!important;gap:5px}
.ffp input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:0;width:150px;flex:none}
.ffp input[type=date]:disabled{opacity:.45}
.folga-note{display:flex;align-items:center;gap:8px;background:#f0fdf4;color:#166534;border-radius:10px;padding:9px 12px;font-size:12px;margin:0}
.fcfg{display:flex;flex-direction:column;gap:10px}
.fc-r{display:grid;grid-template-columns:170px minmax(0,260px) 1fr;gap:14px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px}
.fc-r.ro{opacity:.75}
.fc-b{display:flex;flex-direction:column;gap:2px}
.fc-b b{font-weight:600;display:flex;align-items:center;gap:6px}
.fc-b .emb{display:none}
.fc-b small{color:var(--muted);font-size:10.5px}
.fc-ex{font-size:12px;color:var(--ink2)}
.hb-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hb-head b{display:block;font-weight:600;font-size:15px}
.hb-head small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-top:2px}
.hb-bars{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.hb-bar{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;border:0;background:none;padding:0;text-align:left}
.hb-n{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500}
.hb-n .emb{border-radius:50%!important;flex:none}
.hb-t{display:flex;height:12px;background:#f1f2f6;border-radius:6px;overflow:hidden}
.hb-t i{display:block;height:100%}
.hb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hb-c{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.hb-ch{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.hb-ch b{flex:1;font-weight:600;font-size:14px;color:var(--c)}
.hb-ch .emb{display:none}
.hb-l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.hb-l span{display:flex;align-items:center;gap:6px}
.hb-l.sub{padding-left:18px;font-size:11.5px}
.hb-top{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.hb-top b{color:#047857;font-weight:600}
@media (max-width:720px){
  .fg-row{flex-direction:column}.fg-row input{width:100%}
  .fc-r{grid-template-columns:1fr;gap:8px}
  .hb-grid{grid-template-columns:1fr}
  .hb-bar{grid-template-columns:96px 1fr auto;gap:8px}
  .ffp{flex-wrap:wrap}.ffp input[type=date]{flex:1}
}

/* ================= v2.5 ================= */
.esc.man .esc-tipo{color:#0d9488}
.rc{display:inline-block;background:#ecfdf5;color:#047857;border-radius:8px;padding:0 6px;font-size:10px;font-weight:600;margin-left:4px}
.rc-tgl{margin-top:8px;color:#9a3412!important;font-weight:500;white-space:normal!important}
.hm-h{display:flex;align-items:center;gap:8px}
.hm-h input{width:110px;flex:none}
.hm-h span:last-child{color:var(--muted);font-size:12px}
.he-plus.big{font-size:16px;padding:4px 10px}
.f .tgl input[type=checkbox]{width:auto!important;flex:none;margin:0}
.rc-tgl{display:flex!important;align-items:flex-start!important;gap:8px;text-align:left;line-height:1.4}
.rc-tgl input{margin-top:2px!important}

/* ========================= Ícones ========================= */
const ICONS = {

/* ========================= Utilitários ========================= */
const $ = (s, el=document) => el.querySelector(s);

const fmtD = s => s ? (String(s).length <= 10 ? parseISO(s) : new Date(s)).toLocaleDateString('pt-BR') : '—';

  if(!s) return '';
  const m = (Date.now() - new Date(s)) / 60000;
  if (m < 1) return 'agora';
  if (m < 60) return `há ${Math.floor(m)} min`;
  const h = m / 60; if (h < 24) return `há ${Math.floor(h)} h`;

  return 'em ' + fmtD(s);
}

function downloadCSV(name, rows){
  const s = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const b = new Blob(['\ufeff' + s], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

  async insert(t, row){ return (await this.insertMany(t, [row]))[0]; },
  async insertMany(t, rows){
    if (!rows.length) return [];
    if (TEST){
      const d = Store.load(); d[t] = d[t] || [];
      const out = rows.map(row => { const r = {...row};
        r.id = t === 'chamados' ? Math.max(0, ...d[t].map(x => +x.id)) + 1 : uid();
        r.created_at = nowISO(); d[t].push(r); return r; });
      Store.save(); return out;
    }
    const {data, error} = await sb.from(t).insert(rows).select(); if (error) throw error; return data;
  },
  async upsert(t, row, key){
    if (TEST){ const d = Store.load(); d[t] = d[t] || []; const r = d[t].find(x => x[key] === row[key]); if (r) Object.assign(r, row); else d[t].push({...row}); Store.save(); return; }
    const {error} = await sb.from(t).upsert(row, {onConflict:key}); if (error) throw error;
  },
  async update(t, id, patch){
    if (TEST){ const d = Store.load(); const r = d[t].find(x => sameId(x.id, id)); if (r) Object.assign(r, patch); Store.save(); return r; }
    const {error} = await sb.from(t).update(patch).eq('id', id); if (error) throw error;
  },
  async remove(t, id){
    if (TEST){
      const d = Store.load(); d[t] = d[t].filter(x => !sameId(x.id, id));
      if (t === 'veiculos'){
        d.colaboradores.forEach(c => { if (sameId(c.veiculo_id, id)) c.veiculo_id = null; });
        d.chamados.forEach(c => { if (sameId(c.veiculo_id, id)) c.veiculo_id = null; });
        d.veiculo_historico = d.veiculo_historico.filter(x => !sameId(x.veiculo_id, id));
      }
      if (t === 'colaboradores'){
        d.eventos = d.eventos.filter(e => !sameId(e.colaborador_id, id));
        d.chamados.forEach(c => { if (sameId(c.colaborador_id, id)) c.colaborador_id = null; });
      }
      if (t === 'chamados') d.mensagens = d.mensagens.filter(m => !sameId(m.chamado_id, id));
      if (t === 'escalas') d.eventos = d.eventos.filter(e => !sameId(e.escala_id, id));
      Store.save(); return;
    }
    const {error} = await sb.from(t).delete().eq('id', id); if (error) throw error;
  }
};

function startOfWeek(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return x; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDur(h){ if (h == null) return '—'; if (h < 1) return Math.max(1, Math.round(h*60)) + ' min'; if (h < 48) return (h < 10 ? h.toFixed(1).replace('.', ',') : Math.round(h)) + ' h'; return Math.round(h/24) + ' dias'; }
function ausentesEm(ds){ return new Set(evsV().filter(e => e.data_inicio <= ds && e.data_fim >= ds).map(e => String(e.colaborador_id))); }

function ringSVG(pct, color, size=60, sw=7){
  const r = (size - sw)/2, c = 2*Math.PI*r, p = Math.max(0, Math.min(1, pct || 0)), m = size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="ring" aria-hidden="true"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="#eef0f6" stroke-width="${sw}"/>${p>0?`<circle class="ring-v" cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${m} ${m})"/>`:''}<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${Math.round(size*.23)}" font-weight="600" fill="#1d2033">${Math.round(p*100)}%</text></svg>`;
}
function sparkSVG(vals, color, w=128, h=44){
  const max = Math.max(1, ...vals), n = vals.length, step = (w-8)/(n-1);
  const pts = vals.map((v,i) => [4 + i*step, h - 5 - (v/max)*(h-12)]);
  const line = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[n-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="spark" aria-hidden="true"><path d="${line} L${last[0].toFixed(1)} ${h} L4 ${h} Z" fill="${color}" opacity=".13"/><path class="spark-l" d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/></svg>`;
}
function gaugeSVG(pct, color){
  const R = 90, L = Math.PI*R, p = Math.max(0, Math.min(1, pct || 0));
  const d = 'M 20 112 A 90 90 0 0 1 200 112';
  const ticks = [0,.25,.5,.75,1].map(t => { const a = Math.PI*(1-t), x1 = 110+Math.cos(a)*104, y1 = 112-Math.sin(a)*104, x2 = 110+Math.cos(a)*110, y2 = 112-Math.sin(a)*110; return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#d6d9e6" stroke-width="2" stroke-linecap="round"/>`; }).join('');
  return `<svg viewBox="0 0 220 122" class="gauge" aria-hidden="true">${ticks}<path d="${d}" fill="none" stroke="#eef0f6" stroke-width="18" stroke-linecap="round"/>${p>0?`<path class="gauge-v" d="${d}" fill="none" stroke="${color}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${(L*p).toFixed(1)} ${L.toFixed(1)}"/>`:''}</svg>`;
}
function weeksChart(chs){
  const W = 8, s0 = startOfWeek(new Date()), weeks = [];
  for (let i = W-1; i >= 0; i--){ const a = addDays(s0, -7*i); weeks.push({a, b:addDays(a,7), ab:0, re:0}); }
  const find = t => weeks.find(w => t >= w.a && t < w.b);
  chs.forEach(c => { const w = find(new Date(c.created_at)); if (w) w.ab++; if (c.resolvido_em){ const w2 = find(new Date(c.resolvido_em)); if (w2) w2.re++; } });
  const max = Math.max(1, ...weeks.map(w => Math.max(w.ab, w.re)));
  const stepV = Math.max(1, Math.ceil(max/4)), top = stepV*4;
  const VW = 640, VH = 230, pl = 30, pb = 28, pt = 12, ch = VH-pb-pt, cw = (VW-pl)/W, bw = Math.min(18, cw/4);
  let g = '';

  const bar = (x, v, col, i, lbl) => { const hgt = v/top*ch; return v ? `<rect class="b" style="animation-delay:${i*60}ms" x="${x}" y="${pt+ch-hgt}" width="${bw}" height="${hgt}" rx="5" fill="${col}"><title>${lbl}: ${v}</title></rect>` : `<rect x="${x}" y="${pt+ch-2}" width="${bw}" height="2" rx="1" fill="#e4e6ef"/>`; };

async function saveColab(id){

async function saveVeic(id){

function cellStr(v){
  if (v == null) return '';
  if (v instanceof Date){ const d = new Date(v.getTime() + 12*3600e3); return iso(d); }
  if (typeof v === 'number') return Number.isInteger(v) ? v.toLocaleString('fullwide',{useGrouping:false}) : String(v);
  return String(v).trim();
}
function parseDate(s){

  const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if (m){ let y = +m[3]; if (y < 100) y += 2000; const d = new Date(y, +m[2]-1, +m[1]); if (d.getMonth() === +m[2]-1) return iso(d); }

}
const mapStatusC = s => { const n = nk(s); if (!n) return 'ativo'; return Object.keys(CSTATUS).find(k => nk(CSTATUS[k].label) === n || k === n) || (n.startsWith('afast')?'afastado':n.startsWith('desl')?'desligado':n.startsWith('fer')?'ferias':undefined); };

const mapTipo = s => { const n = nk(s); if (n.startsWith('moto')) return 'moto'; if (n.startsWith('carro') || n.startsWith('auto') || n.startsWith('utilit')) return 'carro'; return n ? undefined : 'carro'; };

let IMPST = null;
async function readImport(kind, file){
  const box = $('#impres'); box.innerHTML = `<div class="muted" style="padding:14px 0">Lendo ${esc(file.name)}...</div>`;
  try {
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), {type:'array', cellDates:true});
    const sn = wb.SheetNames.find(n => !/instru/i.test(n)) || wb.SheetNames[0];
    const aoa = X.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:''});
    const sc = IMP[kind];
    let hr = -1, map = null;
    for (let r = 0; r < Math.min(aoa.length, 8); r++){
      const m = {}; aoa[r].forEach((h, ci) => { const n = nk(h); const col = sc.cols.find(c => c.al.includes(n)); if (col && m[col.k] == null) m[col.k] = ci; });
      if (Object.keys(m).length >= 2){ hr = r; map = m; break; }
    }
    if (hr < 0) throw new Error('Não encontrei os títulos das colunas. Use a planilha modelo.');
    const miss = sc.cols.filter(c => c.req && map[c.k] == null && !(c.k === 'base'));
    if (miss.length) throw new Error('Faltam as colunas: ' + miss.map(c => c.h).join(', ') + '.');
    const raw = [];
    for (let r = hr + 1; r < aoa.length; r++){
      const o = {_line: r + 1}; let any = false;
      sc.cols.forEach(c => { const ci = map[c.k]; const v = ci == null ? '' : cellStr(aoa[r][ci]); o[c.k] = v; if (v) any = true;
        if (c.k === 'pos' && ci != null && typeof aoa[r][ci] === 'number' && aoa[r][ci] >= 1e15) o._posRisk = true; });
      if (any) raw.push(o);
    }
    if (!raw.length) throw new Error('A planilha não tem linhas preenchidas.');
    IMPST = {kind, file:file.name, raw, baseDef: curBaseKey() || ''};
    validateImport(); drawImport();
  } catch(e){ box.innerHTML = `<div class="imp-err">${ic('alert',16)}${esc(e.message || String(e))}</div>`; $('#impgo').disabled = true; }
}
function validateImport(){
  const st = IMPST, out = [];
  if (st.kind === 'veic'){
    const seen = new Set();
    st.raw.forEach(o => {
      const r = {line:o._line, errs:[], warns:[], d:{}};
      const placa = normPlaca(o.placa), tipo = mapTipo(o.tipo), base = baseKey(o.base) ?? null, status = mapStatusV(o.situacao);
      const b = base || (o.base ? null : st.baseDef);
      if (!placaOk(placa)) r.errs.push('placa inválida');
      else if (seen.has(placa)) r.errs.push('placa repetida na planilha');
      seen.add(placa);
      if (!tipo) r.errs.push('tipo deve ser Carro ou Moto');
      if (!b) r.errs.push(o.base ? `base "${o.base}" não existe` : 'sem base');
      else if (!allowed(b)) r.errs.push(`base ${bName(b)} fora do seu acesso`);
      const ex = S.veics.find(v => v.placa === placa);
      if (ex && !allowed(ex.base)) r.errs.push('placa já cadastrada em outra base');
      if (!o.modelo && !ex) r.errs.push('falta o modelo');
      if (status === undefined){ r.warns.push(`situação "${o.situacao}" não reconhecida, ficou Operando`); }
      const ano = o.ano ? parseInt(o.ano) : null, km = o.km ? parseInt(String(o.km).replace(/\D/g,'')) : null;
      r.d = {placa, tipo, base:b, marca:o.marca||null, modelo:o.modelo||null, ano:isNaN(ano)?null:ano, cor:o.cor||null, km:isNaN(km)?null:km, status:status||'ok', observacoes:o.observacoes||null};
      r.match = ex || null; r.act = ex ? 'atualizar' : 'novo';
      r.show = [placa || o.placa, o.modelo || ex?.modelo || '', b ? BASES[b].nome : (o.base||'—'), VSTATUS[r.d.status].label];
      out.push(r);
    });
  } else {
    const placas = new Map();
    st.raw.forEach(o => {
      const r = {line:o._line, errs:[], warns:[], d:{}};
      const base = baseKey(o.base) ?? null, b = base || (o.base ? null : st.baseDef);
      const status = mapStatusC(o.status), adm = parseDate(o.admissao), pos = o.pos ? o.pos.replace(/\s+/g,'') : null;
      if (!o.nome) r.errs.push('falta o nome');
      if (!b) r.errs.push(o.base ? `base "${o.base}" não existe` : 'sem base');
      if (status === undefined) r.warns.push(`status "${o.status}" não reconhecido, ficou Ativo`);
      if (adm === undefined) r.warns.push(`data de admissão "${o.admissao}" ignorada`);
      if (o._posRisk) r.warns.push('Nº POS veio como número no Excel e pode ter perdido dígitos — confira');
      let veiculo_id;
      if (o.placa){
        const p = normPlaca(o.placa), v = S.veics.find(x => x.placa === p);

      }
      const nn = nk(o.nome);
      const ex = (o.matricula && S.colabs.find(c => c.matricula && String(c.matricula) === o.matricula))
        || (pos && S.colabs.find(c => c.pos && c.pos === pos))
        || (nn && S.colabs.find(c => nk(c.nome) === nn)) || null;
      r.d = {nome:o.nome||null, base:b, cargo:o.cargo||null, matricula:o.matricula||null, telefone:o.telefone ? fmtPhone(o.telefone) : null, email:o.email||null, pos,
        admissao:adm||null, status:status||'ativo', observacoes:o.observacoes||null};

      r.match = ex; r.act = ex ? 'atualizar' : 'novo';
      r.show = [o.nome || '—', b ? BASES[b].nome : (o.base||'—'), pos || '—', o.placa ? normPlaca(o.placa) : '—'];
      out.push(r);
    });

function drawImport(){

const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };

function lastSeen(){

function buildNotifs(){

      news.push({key:`ch:${c.id}:done`, icon:'check', c:'#22c55e', t:`Concluída${tp==='pedido' && P(c.destinatario_id) ? ' por ' + firstName(P(c.destinatario_id).nome) : ''}`, s:`#${c.id} ${c.titulo}`, when:c.resolvido_em, act:'ch-open', id:c.id});
  });
  S.escalas.filter(e => allowed(e.base) || sameId(e.responsavel_id, me)).forEach(e => { if (!sameId(e.criado_por, me) && after(e.created_at) && (e.data >= today))
    news.push({key:`esc:${e.id}:new`, icon:ESC_T[e.tipo].icon, c:escColor(e), t:`Nova escala — ${bName(e.base)}`, s:`${escTitle(e)} ${fmtD(e.data)} ${hhmm(e.hora_inicio)}`, when:e.created_at, act:'esc-open', id:e.id}); });

      rem.push({icon:'cal', c:o.color, t:`${nome}: ${o.label.toLowerCase()} a partir de amanhã`, s:rangeTxt(e.data_inicio, e.data_fim), act:'ev-open', id:e.id, w:3});

    rem.push({icon:'clock', c:'#ef4444', urgent:true, t: c.prazo < today ? `Pedido atrasado desde ${fmtD(c.prazo)}` : 'Pedido vence hoje', s:`#${c.id} ${c.titulo}${adm ? ' — ' + bName(c.base) : ''}`, act:'ch-open', id:c.id, w:0}));

    s.onload = () => res(window.JSZip); s.onerror = () => { JSZP = null; rej(new Error('Não foi possível carregar o compactador. Verifique a internet.')); }; document.head.appendChild(s); });

const qKey = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${x.getDate() <= 15 ? 1 : 2}`; };
const qLabel = k => { const [y,m,q] = k.split('-'); const last = new Date(+y, +m, 0).getDate(); const mes = cap(new Date(+y, +m-1, 1).toLocaleDateString('pt-BR',{month:'long'}));
  return q === '1' ? `1 a 15 de ${mes} ${y}` : `16 a ${last} de ${mes} ${y}`; };
const fmtMB = b => b >= 1048576 ? (b/1048576).toFixed(1).replace('.',',') + ' MB' : Math.max(1, Math.round((b||0)/1024)) + ' KB';

  S.anexos.filter(a => inScope(a.base)).forEach(a => { const k = qKey(a.created_at); (map[k] = map[k] || {key:k, all:[]}).all.push(a); });
  return Object.values(map).map(q => ({...q, onServer:q.all.filter(a => !a.removido_em), size:q.all.filter(a => !a.removido_em).reduce((s,a) => s + (a.tamanho||0), 0),
    baixado:q.all.some(a => a.baixado_em) })).sort((a,b) => b.key.localeCompare(a.key));

async function prepFile(file){
  const t = (file.type || '').toLowerCase();
  if (t === 'application/pdf' || /\.pdf$/i.test(file.name)){
    if (file.size > MAX_MB * 1048576) throw new Error(`O PDF tem ${fmtMB(file.size)}. O limite é ${MAX_MB} MB — tire uma foto do atestado ou reduza o PDF.`);
    return {blob:file, ext:'pdf', mime:'application/pdf'};
  }
  if (/^image\//.test(t)){
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Não consegui abrir a imagem.')); i.src = URL.createObjectURL(file); });
    const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(img.src);
    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.72));
    if (!blob) throw new Error('Não consegui processar a imagem.');
    return {blob, ext:'jpg', mime:'image/jpeg'};
  }
  throw new Error('Envie o atestado em PDF ou como foto (JPG/PNG).');
}

function subscribeRealtime(){
  if (TEST || !sb) return;
  if (S.rt){ try { sb.removeChannel(S.rt); } catch(e){} S.rt = null; }
  S.rt = sb.channel('primarizacao-' + Date.now()).on('postgres_changes', {event:'*', schema:'public'}, () => {
    clearTimeout(rtTimer);
    rtTimer = setTimeout(() => refreshData(false), 1200);
  }).subscribe(status => {
    if (status === 'SUBSCRIBED'){ rtTries = 0; setLive(true); }
    else if (['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)){
      setLive(false);
      clearTimeout(rtRetry);
      if (rtTries < 5) rtRetry = setTimeout(() => resubscribe(), Math.min(60000, 3000 * 2 ** rtTries++));
    }
  });
  clearInterval(hbTimer);
  hbTimer = setInterval(() => {
    if (document.hidden || !S.profile) return;
    if (S.rtOk === false && rtTries < 5) resubscribe();
    if (Date.now() - S.lastLoad > 10 * 60e3) refreshData(true);
  }, 60000);
}

}

// Mantém as folgas do calendário iguais ao plano do plantão (cria, muda a data ou remove)
async function syncFolgas(e, plan){
  let n = 0, falhas = 0;
  const evKey = ev => ev.profile_id ? 'p:' + ev.profile_id : String(ev.colaborador_id);
  for (const ev of folgasDe(e.id)){
    const d = plan.get(evKey(ev));
    try {
      if (!d) await DB.remove('eventos', ev.id);
      else { if (d !== ev.data_inicio) await DB.update('eventos', ev.id, {data_inicio:d, data_fim:d, observacao:`Folga do plantão de ${fmtD(e.data)}`}); n++; }
    } catch(x){ falhas++; }
    plan.delete(evKey(ev));
  }
  for (const [cid, d] of plan){
    const who = String(cid).startsWith('p:') ? {profile_id:String(cid).slice(2), colaborador_id:null} : {colaborador_id:cid};
    try { await DB.insert('eventos', {...who, tipo:'folga', data_inicio:d, data_fim:d, observacao:`Folga do plantão de ${fmtD(e.data)}`, criado_por:S.profile.id, criado_por_nome:S.profile.nome, escala_id:e.id}); n++; } catch(x){ falhas++; }
  }
  if (falhas) toast(`${falhas} folga(s) não puderam ser alteradas — ajuste pelo calendário.`, 'err');
  return n;
}

async function hmSave(id){
  const f = formObj(), h = +String(f.horas || '').replace(',','.');
  if (!f.pessoa) return toast('Escolha quem fez as horas.','err');
  if (!f.data) return toast('Informe o dia.','err');
  if (!h || h <= 0 || h > 24) return toast('Informe as horas (ex: 2 ou 1,5).','err');
  if (!f.motivo) return toast('Escreva o motivo.','err');
  const who = f.pessoa.startsWith('p:') ? {profile_id:f.pessoa.slice(2), colaborador_id:null} : {colaborador_id:f.pessoa, profile_id:null};
  const row = {...who, base:f.base, data:f.data, horas:Math.round(h*100)/100, motivo:f.motivo};
  try {
    if (id) await DB.update('horas_manuais', id, row);
    else await DB.insert('horas_manuais', {...row, criado_por:S.profile.id, criado_por_nome:S.profile.nome});
    closeModal(); toast(`+${fmtH(row.horas)} lançadas para ${PX(f.pessoa)?.nome || 'a pessoa'} em ${fmtD(f.data)}.`);
    const d = parseISO(f.data); S.esc.y = d.getFullYear(); S.esc.m = d.getMonth(); await reload();
  } catch(e){ err(e); }

async function hmDel(id){

  try { await DB.remove('horas_manuais', id); closeModal(); toast('Lançamento excluído.'); await reload(); } catch(e){ err(e); }

const catCor = c => EST_CAT_COR[c] || '#64748b';
const MOV = {entrada:{label:'Entrada', color:'#16a34a', icon:'plus'}, saida:{label:'Saída', color:'#dc2626', icon:'minus'}, ajuste:{label:'Contagem', color:'#4f63d6', icon:'checks'}, transferencia:{label:'Transferência', color:'#9333ea', icon:'swap'}};
const fmtQ = (n, un) => (Math.round((+n||0)*100)/100).toLocaleString('pt-BR') + (un ? ' ' + un : '');
const itemOf = id => S.estItens.find(i => sameId(i.id, id));
const saldoOf = (item, base) => S.estSaldos.find(s => sameId(s.item_id, item.id) && s.base === base) || null;
const qtdOf = (item, base) => +(saldoOf(item, base)?.quantidade || 0);
const minOf = (item, base) => { const s = saldoOf(item, base); return s && s.minimo != null ? +s.minimo : +(item.minimo_padrao || 0); };
const nivel = (q, m) => q <= 0 ? 'zero' : (m > 0 && q <= m) ? 'baixo' : (m > 0 && q <= m * 1.5) ? 'atencao' : 'ok';
const NIV = {zero:{label:'Zerado', color:'#dc2626'}, baixo:{label:'Abaixo do mínimo', color:'#ef4444'}, atencao:{label:'Perto do mínimo', color:'#f59e0b'}, ok:{label:'Ok', color:'#22c55e'}};
const estBasesView = () => BKEYS.filter(k => (!S.base || k === S.base) && (!S.est.b || k === S.est.b));
const alertasEstoque = (bases) => { const out = [];
  S.estItens.filter(i => i.ativo !== false).forEach(i => bases.forEach(k => { const q = qtdOf(i, k), m = minOf(i, k); const n = nivel(q, m);
    if ((n === 'zero' && m > 0) || n === 'baixo') out.push({item:i, base:k, q, m, n}); }));
  return out; };

async function estRpc(fn, args){
  if (!TEST){ const {data, error} = await sb.rpc(fn, args); if (error) throw error; return data; }
  const d = Store.load(); d.estoque_saldos = d.estoque_saldos || []; d.estoque_movs = d.estoque_movs || [];
  const getS = (item, base) => { let s = d.estoque_saldos.find(x => x.item_id === item && x.base === base);
    if (!s){ s = {id:uid(), item_id:item, base, quantidade:0, minimo:null, atualizado_em:nowISO(), atualizado_por:S.profile.nome}; d.estoque_saldos.push(s); } return s; };
  const mov = (item, base, tipo, qtd, saldo, motivo, dest) => d.estoque_movs.push({id:uid(), item_id:item, base, tipo, quantidade:qtd, saldo_apos:saldo, motivo, base_destino:dest||null, por_id:S.profile.id, por_nome:S.profile.nome, created_at:nowISO()});
  if (fn === 'estoque_definir_minimo'){ const s = getS(args.p_item, args.p_base); s.minimo = args.p_minimo; Store.save(); return null; }
  const {p_item:it, p_base:b, p_tipo:t, p_qtd:q, p_motivo:mo, p_destino:de} = args;
  if (!allowed(b)) throw new Error('Seu perfil não tem permissão para esta ação.');
  const s = getS(it, b);
  if (t === 'entrada') s.quantidade = +s.quantidade + q;
  else if (t === 'ajuste') s.quantidade = q;
  else { if (+s.quantidade < q) throw new Error('Saldo insuficiente'); s.quantidade = +s.quantidade - q; }
  s.atualizado_em = nowISO(); s.atualizado_por = S.profile.nome;
  mov(it, b, t, q, s.quantidade, mo, de);
  if (t === 'transferencia'){ const s2 = getS(it, de); s2.quantidade = +s2.quantidade + q; s2.atualizado_em = nowISO(); mov(it, de, 'entrada', q, s2.quantidade, 'Transferência de ' + bName(b) + (mo ? ' — ' + mo : ''), null); }
  Store.save(); return s.quantidade;
}

async function setUserBase(id, k){
  const p = P(id); if (!p) return;
  const cur = (p.bases || [])[0];
  const novo = cur === k ? [] : [k];
  const dono = novo.length ? liderOf(k) : null;
  try {
    if (dono && !sameId(dono.id, p.id) && p.role !== 'pendente'){
      if (!await confirmBox(`${esc(BASES[k].nome)} já tem líder: <b>${esc(dono.nome)}</b>.<br>Passar a base para <b>${esc(p.nome)}</b>?`, 'Passar a base')) return;
      await DB.update('profiles', dono.id, {bases:[]});
    }
    if (p.role === 'admin' && novo.length && S.chamados.some(c => tipoOf(c)==='pedido' && c.base===k && c.status!=='resolvido'))
      toast(`Atenção: há pedidos em aberto para ${BASES[k].nome}. Você passa a ser o responsável por eles.`);
    await DB.update('profiles', id, {bases:novo});
    toast(`${firstName(p.nome)}: ${novo.length ? 'líder de ' + BASES[k].nome : 'sem base'}`); await reload();
  } catch(e){ err(e); reload(); }
}

    <form id="lf" class="lform">

      <button type="button" class="linkbtn" id="lforgot">Esqueci minha senha</button>
    </form>`);
  bindLogin();
}
function bindLogin(){
  let mode = 'in';
  $$('#lmode button').forEach(b => b.onclick = () => {
    mode = b.dataset.m; $$('#lmode button').forEach(x => x.classList.toggle('on', x === b));
    $$('.up').forEach(x => x.hidden = mode !== 'up'); $('#lbtn').textContent = mode === 'in' ? 'Entrar' : 'Criar conta';
    $('#lforgot').hidden = mode !== 'in'; $('#lmsg').textContent = '';
    $('[name=senha]').autocomplete = mode === 'in' ? 'current-password' : 'new-password';
  });
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const f = formObj('#lf'), m = $('#lmsg'), btn = $('#lbtn'); m.className = 'lmsg'; m.textContent = ''; btn.disabled = true;
    try {
      if (mode === 'in'){
        const {data, error} = await sb.auth.signInWithPassword({email:f.email, password:f.senha}); if (error) throw error;
        await afterLogin(data.user);
      } else {
        if (!f.nome) throw new Error('Informe seu nome completo.');
        if (!f.base) throw new Error('Escolha sua base.');
        const {data, error} = await sb.auth.signUp({email:f.email, password:f.senha, options:{data:{nome:f.nome, base:f.base}, emailRedirectTo:location.href.split('#')[0]}});
        if (error) throw error;
        if (data.session) await afterLogin(data.user);
        else { m.className = 'lmsg ok'; m.textContent = 'Conta criada! Abra o link enviado ao seu e-mail para confirmar e depois entre.'; }
      }
    } catch(er){ m.className = 'lmsg'; m.textContent = traduz(er.message); }
    finally { if (document.body.contains(btn)) btn.disabled = false; }
  };
  $('#lforgot').onclick = async () => {
    const email = $('#lf [name=email]').value.trim(), m = $('#lmsg');
    if (!email){ m.className = 'lmsg'; m.textContent = 'Digite seu e-mail acima e clique de novo em "Esqueci minha senha".'; return; }
    const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo:location.href.split('#')[0]});
    m.className = 'lmsg ' + (error ? '' : 'ok'); m.textContent = error ? traduz(error.message) : 'Enviamos um link para redefinir a senha.';
  };
}

async function afterLogin(user){
  try {
    if (TEST){ S.profile = Store.load().profiles.find(p => sameId(p.id,user.id)); try{ sessionStorage.setItem('prim_test_user', user.id); }catch(e){} }
    else {
      const {data, error} = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if (error) throw error;
      if (!data){ S.profile = {nome:user.email, role:'pendente', ativo:true}; return renderPending(); }
      S.profile = data;
    }
    if (!S.profile || S.profile.role === 'pendente' || !S.profile.ativo) return renderPending();

    const n = buildNotifs(); if (n.news.length) toast(`Você tem ${n.news.length} aviso(s) novo(s) — veja no sino.`);
  } catch(e){ err(e); renderLogin(traduz(e.message)); }
}

  else if (np && e.target.closest('#npanel [data-act]') && !e.target.closest('[data-act=notif-read],[data-act=notif-rem]')) $('#npanel')?.remove();
  const a = e.target.closest('[data-act]');
  if (a){ if (a.tagName === 'A') return; ACT[a.dataset.act]?.(a, e); return; }
  const n = e.target.closest('[data-nav]'); if (n) go(n.dataset.nav);
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.chg) CHG[t.dataset.chg]?.(t); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#npanel')) $('#npanel').remove(); else if ($('#pop')) closePop(); else closeModal(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act],[role=button][data-nav]')){ e.preventDefault(); e.target.click(); }
});
window.addEventListener('scroll', closePop, true);
window.addEventListener('resize', closePop);

/* ========================= Início ========================= */
(async function boot(){
  if (TEST){
    let id = null; try { id = sessionStorage.getItem('prim_test_user'); } catch(e){}
    return id && Store.load().profiles.find(p => p.id === id) ? afterLogin({id}) : renderLogin();
  }
  if (!CFG_OK || !sb) return renderSetup();
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') setTimeout(askNewPassword, 300);
    if (ev === 'TOKEN_REFRESHED' && session){ try { sb.realtime.setAuth(session.access_token); } catch(e){} }
    if (ev === 'SIGNED_OUT' && S.profile){ S.profile = null; renderLogin('Sua sessão terminou. Entre de novo.'); }
  });
  const {data:{session}} = await sb.auth.getSession();
  session ? await afterLogin(session.user) : renderLogin();
})();
</script>
